<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>1940 ：誰能活下去？</title>
    <!-- 引入 Noto Serif TC (支援 400 一般與 900 Black 粗細) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --parchment-bg: #f4ecd8;
            --parchment-dark: #e8dbbf;
            --text-main: #2b221e;
            --text-muted: #5c4a42;
            --border-color: #7b6243;
            --accent-red: #8b0000;
            --accent-blue: #1c3b57;
            --accent-green: #2b6938; 
            --card-bg: #fbf8f1;
        }

        body {
            background-color: #1a1614;
            background-image: radial-gradient(circle, #2a2421 0%, #110f0e 100%);
            color: var(--text-main);
            font-family: "Noto Serif TC", "Songti TC", "STSong", serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: 1.2rem;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            background-color: var(--parchment-bg);
            background-image: radial-gradient(circle at center, #fdfbf7 0%, var(--parchment-bg) 100%);
            border: 6px double var(--border-color);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 0 80px rgba(123, 98, 67, 0.15);
            padding: 50px;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        h1, h2, h3 {
            text-align: center;
            color: var(--text-main);
            letter-spacing: 2px;
        }

        h1 {
            font-family: "Noto Serif TC", serif;
            font-weight: 900; 
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 25px;
            margin-top: 0;
            font-size: 3.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h2 {
            font-weight: 900;
            font-size: 2.2rem;
            margin-bottom: 25px;
        }

        p {
            font-size: 1.5rem;
            line-height: 1.8;
        }

        /* --- 歷史關鍵字高亮樣式 --- */
        .highlight-term {
            color: var(--accent-red);
            font-weight: 900;
            background-color: rgba(139, 0, 0, 0.08);
            padding: 0 4px;
            border-radius: 4px;
            display: inline-block;
            line-height: 1.2;
        }

        .step-section {
            display: none;
        }

        .step-section.active {
            display: block;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            background-color: var(--parchment-dark);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 16px 35px;
            font-size: 1.6rem;
            font-family: inherit;
            font-weight: 900;
            cursor: pointer;
            display: block;
            margin: 40px auto 0;
            transition: all 0.2s ease;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background-color: var(--text-main);
            color: var(--parchment-bg);
            border-color: var(--text-main);
            transform: translateY(-2px);
            box-shadow: 4px 6px 12px rgba(0,0,0,0.2);
        }

        .player-input-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: center;
        }

        .player-input-group label {
            font-weight: 900;
            font-size: 1.6rem;
            width: 120px;
            text-align: right;
        }

        .player-input-group input {
            padding: 12px;
            font-size: 1.5rem;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            font-family: inherit;
            width: 220px;
        }

        select {
            padding: 10px 20px;
            font-size: 1.5rem;
            font-family: inherit;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            cursor: pointer;
        }

        .game-status-bar {
            display: flex;
            justify-content: space-around;
            background: transparent;
            border-bottom: 3px double var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
            font-weight: 900;
            font-size: 1.6rem;
        }

        .card-container {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 40px;
            min-height: 300px;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            position: relative;
            perspective: 1200px;
        }

        /* --- 實體卡牌外觀與 3D 翻轉動畫 --- */
        .card-content {
            font-size: 1.9rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: var(--text-main);
            
            background: linear-gradient(135deg, #ffffff 0%, var(--parchment-bg) 100%);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            box-shadow: 
                8px 12px 25px rgba(0,0,0,0.15), 
                inset 0 0 0 4px rgba(123, 98, 67, 0.3),
                inset 0 0 20px rgba(123, 98, 67, 0.05);
            position: relative;
            transform-origin: center center;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }

        .card-content.flip-anim {
            animation: flipCard3D 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes flipCard3D {
            0% {
                transform: rotateY(-90deg) scale(0.9);
                opacity: 0;
                box-shadow: 0 0 0 rgba(0,0,0,0);
            }
            50% {
                box-shadow: 15px 20px 30px rgba(0,0,0,0.25);
            }
            100% {
                transform: rotateY(0deg) scale(1);
                opacity: 1;
                box-shadow: 8px 12px 25px rgba(0,0,0,0.15), inset 0 0 0 4px rgba(123, 98, 67, 0.3), inset 0 0 20px rgba(123, 98, 67, 0.05);
            }
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            opacity: 0;
        }

        .options-group.fade-in {
            animation: fadeInOptions 0.6s ease forwards 0.3s; 
        }

        @keyframes fadeInOptions {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .option-btn {
            background: var(--parchment-bg);
            border: 2px solid var(--border-color);
            padding: 20px 25px;
            text-align: left;
            font-size: 1.6rem;
            font-family: inherit;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1.5;
            border-radius: 6px;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--parchment-dark);
            border-color: var(--text-main);
            transform: translateX(5px);
            box-shadow: 2px 4px 8px rgba(0,0,0,0.1);
        }
        
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
            pointer-events: none; /* 禁用時不觸發 hover 音效與動畫 */
        }

        /* --- 劇情回饋視窗 (Feedback Overlay) 樣式 --- */
        .feedback-overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(26, 22, 20, 0.92);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 30px;
        }

        .feedback-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease-in-out;
        }

        .feedback-box {
            background: var(--card-bg);
            border: 4px double var(--border-color);
            padding: 40px;
            width: 80%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            position: relative;
        }

        .fb-player-title {
            font-size: 1.8rem;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            margin-top: 0;
        }

        .fb-text {
            font-size: 1.8rem;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: 900;
        }

        .fb-stats {
            font-size: 1.8rem;
            margin-bottom: 30px;
            background: var(--parchment-dark);
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #ddd;
            margin-bottom: 20px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: var(--border-color);
        }

        .progress-bar.active {
            animation: progress 6s linear forwards;
        }

        @keyframes progress {
            from { width: 100%; }
            to { width: 0%; }
        }

        .ending-card {
            background: var(--card-bg);
            border: 4px double var(--border-color);
            padding: 40px;
            margin-top: 30px;
        }

        .ending-card h3 {
            font-size: 2rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .ending-card h4 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .ending-card a {
            color: var(--accent-blue);
            font-weight: 900;
            text-decoration: underline;
        }

        .score-board {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            margin-bottom: 30px;
            font-size: 1.5rem;
        }

        .score-board th, .score-board td {
            border: 2px solid var(--border-color);
            padding: 15px;
            text-align: center;
        }

        .score-board th { background-color: var(--parchment-dark); }
        .survival-score-text { color: var(--accent-red); display: inline-block; }
        .moral-score-text { color: var(--accent-blue); display: inline-block; }
        
        /* --- 成就徽章樣式 --- */
        .badge-section {
            margin-top: 22px;
            padding: 18px 20px;
            background: linear-gradient(135deg, #fffaf0 0%, #f3e7c4 100%);
            border: 2px solid #b8860b;
            border-radius: 10px;
        }
        .badge-title {
            font-weight: 900;
            font-size: 1.5rem;
            color: #8a6508;
            margin-bottom: 12px;
        }
        .badge-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .badge-chip {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            background: #fff;
            border: 1px solid #d9c27a;
            border-radius: 8px;
            padding: 10px 14px;
        }
        .badge-icon { font-size: 1.8rem; line-height: 1.2; flex-shrink: 0; }
        .badge-text { font-size: 1.15rem; line-height: 1.5; color: var(--text-main); text-align: left; }
        .badge-text strong { font-size: 1.25rem; color: #8a6508; }

        /* --- 人生跑馬燈與最重大抉擇樣式 --- */
        .history-section {
            margin-top: 25px;
            padding: 20px;
            background: var(--parchment-bg);
            border: 2px dashed var(--border-color);
        }
        .history-title {
            font-weight: 900;
            font-size: 1.6rem;
            color: var(--accent-blue);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .history-cards {
            font-size: 1.4rem;
            color: var(--text-muted);
            word-wrap: break-word;
            line-height: 1.6;
            margin-bottom: 20px;
        }
        .worst-decision {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px dotted var(--border-color);
        }
        .worst-title {
            color: var(--accent-red);
            font-size: 1.5rem;
            font-weight: 900;
            margin-bottom: 10px;
        }
        .worst-content {
            color: var(--text-main);
            font-size: 1.3rem;
            line-height: 1.6;
            background: var(--card-bg);
            padding: 15px;
            border: 1px solid var(--border-color);
        }

        .bounce-anim { animation: scoreBounce 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes scoreBounce {
            0% { transform: scale(1); }
            30% { transform: scale(1.8) translateY(-3px); color: var(--accent-green); text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
            100% { transform: scale(1); }
        }
        
        #music-toggle-btn {
            position: absolute; top: 20px; right: 20px;
            background: transparent; border: 1px solid var(--border-color);
            padding: 8px 12px; cursor: pointer; font-weight: bold; color: var(--text-muted);
            border-radius: 4px; z-index: 10;
        }
        #music-toggle-btn:hover { background-color: var(--border-color); color: var(--parchment-bg); }
        
        .death-banner {
            background-color: var(--text-main); color: var(--parchment-bg);
            padding: 25px; text-align: center; font-size: 2rem; font-weight: 900;
            margin-bottom: 35px; border: 3px double var(--parchment-bg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: shake 0.6s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }

        /* --- Q 版繪本風角色頭像 --- */
        .avatar-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 18px 16px 20px;
            width: 220px;
            text-align: center;
            box-shadow: 3px 5px 12px rgba(0,0,0,0.15);
            animation: avatarPop 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
            animation-delay: var(--d, 0s);
        }
        .avatar-card.rerolled { animation: avatarPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both; }
        @keyframes avatarPop {
            from { opacity: 0; transform: translateY(20px) rotate(-3deg) scale(0.9); }
            to   { opacity: 1; transform: translateY(0) rotate(0) scale(1); }
        }
        .avatar-card svg { display: block; margin: 0 auto 10px; }
        .avatar-name { font-size: 1.8rem; font-weight: 900; }
        .avatar-occ {
            font-size: 1.15rem;
            color: var(--text-muted);
            margin: 4px 0 10px;
            letter-spacing: 1px;
        }
        .avatar-role { font-weight: 900; font-size: 1.6rem; }
        .reroll-btn {
            margin-top: 14px;
            background: transparent;
            border: 1px dashed var(--border-color);
            border-radius: 6px;
            padding: 6px 12px;
            font-family: inherit;
            font-size: 1.05rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .reroll-btn:hover { background: var(--border-color); color: var(--parchment-bg); }
        .game-status-bar { align-items: center; flex-wrap: wrap; gap: 10px; }
        #current-player-avatar { display: inline-flex; align-items: center; }
        .ending-card p { margin: 0 0 14px; }
        .ending-card .ending-link { font-size: 1.2rem; word-break: break-all; color: var(--text-muted); }
.scene-box { margin: -14px -14px 22px; }
        .scene-box .scene-wrap { margin: 0; display: block; }
        .scene-box svg {
            width: 100%; height: auto; display: block; border-radius: 10px 10px 0 0;
            border: 3px solid var(--border-color); border-bottom-width: 1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
        }
        .scene-box .scene-cap {
            font-size: 1.05rem; text-align: center; color: var(--text-muted);
            margin: 6px 0 0; font-style: italic;
        }
        .card-content.chance-card {
            background: linear-gradient(135deg, #fffdf3 0%, #f1e3b4 100%);
            border-color: #b8860b;
            box-shadow: 8px 12px 25px rgba(0,0,0,0.15), inset 0 0 0 4px rgba(184, 134, 11, 0.45), inset 0 0 20px rgba(184, 134, 11, 0.12);
        }
        .card-content.chance-card::before {
            content: "✦ ✦ ✦";
            display: block; text-align: center; font-weight: 900; font-size: 1.3rem;
            color: #8a6508; letter-spacing: 4px; margin-bottom: 14px;
        }
        .option-btn.chance-btn { text-align: center; border-color: #b8860b; background: #f7ecc8; }
        .status-label { font-weight: 900; transition: color 0.4s; }
        .status-label.s-safe { color: var(--accent-green); }
        .status-label.s-uneasy { color: #a8761a; }
        .status-label.s-danger { color: var(--accent-red); }
        .status-label.s-critical { color: var(--accent-red); animation: pulseWarn 1.2s ease-in-out infinite; }
        @keyframes pulseWarn { 50% { opacity: 0.45; } }
        .player-roster {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 14px;
            margin: -10px 0 25px;
        }
        .roster-item { position: relative; text-align: center; padding: 6px 8px 4px; border: 2px solid transparent; border-radius: 8px; font-size: 1rem; font-weight: 900; color: var(--text-muted); }
        .roster-item svg { display: block; margin: 0 auto 2px; }
        .roster-item.current { border-color: var(--accent-red); background: rgba(139,0,0,0.06); color: var(--text-main); }
        .roster-item.dead svg { filter: grayscale(1) brightness(0.8); opacity: 0.55; }
        .roster-item.dead { color: #8a8078; text-decoration: line-through; }
        .roster-item.dead::after { content: "✕"; position: absolute; top: 4px; left: 50%; transform: translateX(-50%); font-size: 2rem; color: var(--accent-red); font-weight: 900; line-height: 1; margin-top: 8px; }
        .fb-hint { font-weight: 900; }
        .fb-hint.up { color: var(--accent-green); }
        .fb-hint.down { color: var(--accent-red); }
        .fb-hint.dead { color: var(--parchment-bg); background: var(--text-main); display: block; padding: 6px; }
        .ending-avatar { text-align: center; margin-bottom: 10px; }
        .ending-avatar svg { display: inline-block; }
        .ending-avatar.dead svg { filter: grayscale(1) brightness(0.85); }


        /* --- 派對稱號系統 --- */
        .roster-item .title-pin {
            position: absolute; top: -6px; right: -4px; font-size: 1.35rem; line-height: 1;
            background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 50%;
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
            box-shadow: 1px 2px 5px rgba(0,0,0,0.25); text-decoration: none;
            animation: pinPop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes pinPop { from { transform: scale(0) rotate(-40deg); } to { transform: scale(1) rotate(0); } }
        .player-titles { margin: 0 0 25px; display: none; }
        .player-titles.show { display: block; animation: fadeIn 0.6s ease-in-out; }
        .titles-heading {
            text-align: center; font-weight: 900; font-size: 1.15rem; color: var(--text-muted);
            letter-spacing: 3px; margin-bottom: 10px;
        }
        .titles-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .title-row {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            padding: 6px 12px; background: rgba(255,255,255,0.45);
            border: 2px solid transparent; border-radius: 10px; font-size: 1.1rem;
        }
        .title-row.current { border-color: var(--accent-red); background: rgba(139,0,0,0.07); }
        .title-row.dead { opacity: 0.55; }
        .title-row .tr-name { font-weight: 900; color: var(--text-main); }
        .title-chip {
            display: inline-block; font-weight: 900; font-size: 1.05rem; padding: 2px 10px;
            border-radius: 999px; border: 2px solid var(--border-color); background: #fff;
            white-space: nowrap; box-shadow: 1px 2px 4px rgba(0,0,0,0.12);
        }
        .title-chip.t-bad  { border-color: var(--accent-red); color: var(--accent-red); background: #fdf0ee; }
        .title-chip.t-good { border-color: var(--accent-green); color: var(--accent-green); background: #eef7ef; }
        .title-chip.t-neutral { border-color: #a8761a; color: #7a5410; background: #fbf3dc; }
        .title-chip.t-dead { border-color: #777; color: #555; background: #e4e0d8; }
        .party-prompt {
            margin: 12px auto 0; max-width: 760px; text-align: center; font-size: 1.3rem; font-weight: 900;
            line-height: 1.6; color: var(--text-main); background: #fff6d6;
            border: 2px dashed #b8860b; border-radius: 10px; padding: 10px 16px;
            animation: fadeIn 0.5s ease-in-out;
        }
        .party-prompt .pp-tag { color: var(--accent-red); }

        /* ==========================================================
           響應式設計（RWD）：平板與手機螢幕自動縮放
           ========================================================== */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        svg, img { max-width: 100%; }
        button, select, input { touch-action: manipulation; }
        .avatar-card svg { height: auto; }

        /* 手機翻牌動畫：不使用 perspective 屬性（會困住 fixed 視窗），改用 transform 內的 perspective() */
        @keyframes flipCard3DMobile {
            0%   { transform: perspective(900px) rotateY(-90deg) scale(0.9); opacity: 0; }
            100% { transform: perspective(900px) rotateY(0deg) scale(1); opacity: 1; }
        }

        /* 觸控裝置：取消 hover 位移，避免點擊後按鈕卡在位移狀態 */
        @media (hover: none) {
            .option-btn:hover:not(:disabled), .btn:hover { transform: none; }
        }

        /* ---- 平板與一般手機（≤ 768px） ---- */
        @media (max-width: 768px) {
            body { padding: 10px 8px; font-size: 1rem; align-items: flex-start; }
            .container { width: 100%; padding: 48px 16px 24px; border-width: 4px; }

<script>
/* 錯誤回報：若手機上有任何程式錯誤，會在畫面頂端顯示訊息，方便判斷問題 */
window.addEventListener('error', function (e) {
    try {
        var d = document.getElementById('err-banner');

            d = document.createElement('div'); d.id = 'err-banner';
            d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:9999;background:#8b0000;color:#fff;font:14px/1.5 sans-serif;padding:8px 12px;word-break:break-all;';

        }
        d.textContent = '⚠ 程式錯誤：' + (e.message || '未知') + (e.lineno ? '（第 ' + e.lineno + ' 行）' : '');
    } catch (x) {}
});

<script>
    const gCards = [
        { id: "G01", text: "G01\n凡穆勒醫生認為精神病患者和殘疾兒童是「浪費糧食的人」、「無用之人只是國家負擔」 ，將其安樂死是正當的行為。\n你是否會將劇毒調換為無害藥劑，並協助病童逃離醫院？", opt1: "是，我會暗中替換藥劑", opt2: "否，我會執行安樂死亡", s1: -1, m1: 2, s2: 1, m2: -2, fb1: "你成功救下了病童，但蓋世太保對藥劑的消耗起了疑心，你被列入了監視名單。", fb2: "你冷酷地執行了命令。長官對你的忠誠表示讚賞，但每當深夜，你總會聽見孩童的哭聲。" },
        { id: "G02", text: "G02\n戈林將軍在一戰時創下擊落22架敵機的紀錄，因此被希特勒任命為德國空軍總司令。但是，完善空軍設備的經費卻是他強搶猶太人的財產而來。\n若你是戈林，是否會用猶太人財產來完備德國空軍？", opt1: "是，強大德國實力最重要", opt2: "否，侵吞他人財產不道德", s1: 1, m1: -1, s2: -1, m2: 1, fb1: "德國空軍日益壯大，你的權力也達到了頂峰，但雙手已沾滿無辜者的鮮血。", fb2: "你拒絕了這項提議。元首對你的軟弱感到失望，你的空軍預算遭到大幅削減。" },
        { id: "G03", text: "G03\n「萊茵哈德行動」負責處理猶太人的財產。官員通過柏林的當舖、瑞士的珠寶市場來出售這些財物。然而，巨額財富也引發盜竊、貪腐等行為。\n若你沒收了大量猶太人的財物，你會如何處置？", opt1: "是，直接上繳充實國庫", opt2: "否，私藏珍貴物品變賣", s1: 1, m1: -1, s2: -1, m2: -2, fb1: "你將財富悉數上繳，獲得了上級的口頭表揚，但看著別的軍官中飽私囊，你內心五味雜陳。", fb2: "你偷偷藏起了名貴珠寶發了一筆橫財。然而你每天都心驚膽跳，深怕被查獲後送上軍事法庭。" },
        { id: "G04", text: "G04\n普呂福在日記強烈批評屠殺猶太人的相關政策。但很可惜，普呂福日記的內容是在1946年（二戰結束後）加上去，就是刻意留下紀錄給將來的人閱讀。\n若你有書寫日記的習慣，你是否會像普呂福這樣做？", opt1: "是，我會刪除歧視的言論", opt2: "否，我不會竄改過往言論", s1: 1, m1: -1, s2: -1, m2: 1, fb1: "你銷毀了日記中所有敏感字眼。戰後調查時你成功自保，但歷史真相也因此少了一份見證。", fb2: "你冒著極大風險保留了原稿。這份日記日後成為紐倫堡大審的重要證據，但也讓你在戰時險些喪命。" },
        { id: "G05", text: "G05\n1940年維也納科學會議裡，專家決議將「問題兒童」進行集中監管，但不少醫生反對，認為鼓勵、建立信任才能促進心理健康。\n若你是與會的精神科醫生，你會堅持反對監管嗎？", opt1: "是，即便高層會派人關切", opt2: "否，接受專家決議求升遷", s1: -1, m1: 2, s2: 1, m2: -2, fb1: "你堅持醫學倫理保護了數名兒童，卻被高層視為眼中釘，你的職涯岌岌可危。", fb2: "你妥協了。你如願獲得醫院高層的升遷，但看著被強制帶走的孩童，你的良知受到無盡折磨。" },

        { id: "G10", text: "G10\n德國學校老師都須加入教師聯盟，宣誓效忠希特勒。「種族科學」課程被引入教學，並展示亞利安人特徵的圖像，藉此讓學生鄙視猶太人，而神化希特勒。\n身為納粹德國的老師，是否願意在課堂裡對猶太學生釋出善意？", opt1: "是，我願意提供善意環境", opt2: "否，我不願意多付出關注", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你在課堂上展現的一絲溫柔，成為猶太學生黑暗中的微光，但也引來了納粹青年團學生的側目。", fb2: "你嚴格執行種族隔離。猶太學生在絕望中被迫退學，你保住了教職，卻失去了為人師表的初衷。" },
        { id: "G11", text: "G11\n1940年代，德國勞改場收押大量妓女、小偷、流浪漢、酒鬼等，並請鑑定專家判定價值。專家們宣稱「沒有生存價值」，一致同意將這些人處死。\n若你有認識「符合勞改犯定義」的親屬朋友，你是否會配合政策向警察舉報？", opt1: "是，淨化血統人人有責", opt2: "否，維護家人朋友安危", s1: 1, m1: -2, s2: -1, m2: 2, fb1: "你大義滅親獲得了「模範公民」勳章，但家族從此與你斷絕往來，你餘生都在孤獨中度過。", fb2: "你拼死隱瞞了親屬的下落。雖然成功保住他們的性命，你卻日夜活在被舉發的恐懼之中。" },
        { id: "G12", text: "G12\n女記者費德利希建立反抗組織，來照顧許多身處危險的猶太人。他們還從事破壞工廠、毀損納粹象徵、向國外報導集中營真實情況等激進行為。\n若你意外得知了這個組織的存在，你會怎麼做呢？", opt1: "是，加入組織並提供協助", opt2: "否，向蓋世太保告密，領取賞金", s1: -1, m1: 2, s2: 1, m2: -2, fb1: "你暗中協助破壞行動，拯救了無數猶太人。你的生活從此步步驚心，隨時可能面臨絞刑。", fb2: "你拿到了豐厚的賞金，組織成員隔天全數被捕。你的口袋滿了，靈魂卻徹底墮落。" },
        { id: "G13", text: "G13\n儘管納粹政權秘密進行處置猶太人的最終方案，然而消息卻四處流傳。你聽聞有人參與射殺3000名猶太人行動，而且逼迫猶太人挖掘足球場大小的墳墓。\n若你聽聞不合理的大規模猶太屠殺事件，你是否會將事件上報高層？", opt1: "是，我願意舉發濫殺行為", opt2: "否，他人之行為與我無關", s1: 0, m1: 1, s2: 0, m2: -1, fb1: "你將屠殺事件向上呈報，不僅石沉大海，還收到上級的「善意警告」，命你立刻噤聲。", fb2: "你選擇明哲保身。你在官僚體系中安穩度日，但那些無辜亡魂的悲鳴常在你夢中縈繞。" },
        { id: "G14", text: "G14\n當時社會日漸流行安樂死的觀點，特別是不少父母願意讓孩子得到解脫。同時為了減輕父母親良心負擔，醫生必須承擔解決問題兒童的責任。\n若你的後代是身心障礙病童，且從未聽聞治癒案例，你仍會配合政策，將孩子送入國家經營療養院？", opt1: "是，我會送走孩子", opt2: "否，我會自行撫養", s1: 0, m1: -1, s2: 0, m2: 1, fb1: "你含淚將孩子送上療養院巴士，幾週後只收到一張偽造死因的死亡證明。你追悔莫及。", fb2: "你帶著孩子東躲西藏，生活極度困苦，但每當看到孩子純真的笑容，你深信這一切都值得。" },
        { id: "G15", text: "G15\n隆美爾將軍在二戰時建立彪炳戰功，曾俘虜「自由法國第一旅」，這是由眾多猶太人所組成的部隊。希特勒因此向隆美爾下令，將其成員處決。\n如果你是隆美爾，是否會遵照希特勒指示，處決這些人呢？", opt1: "是，忠誠地執行處決命令", opt2: "否，不忍心執行處決命令", s1: 1, m1: -2, s2: -1, m2: 2, fb1: "你忠實執行了元首的殘酷命令。軍方嘉獎了你的果斷，但這成為你軍事生涯中無法抹滅的汙點。", fb2: "你違抗了希特勒的命令釋放戰俘。此舉為你贏得敵軍的敬重，卻讓元首對你起了殺心。" },
        { id: "G16", text: "G16\n約翰的猶太員工顫抖說著自己收到了「產物清單」，這代表即將被送到集中營。約翰為保全員工性命，向蓋世太保爭取：「你們把員工都帶走了，我該怎麼執行國防部的訂單呢？」\n如果是你，你是否願意向蓋世太保爭取留下員工？", opt1: "是，因為生命可貴", opt2: "否，各人有其命運", s1: -1, m1: 2, s2: 1, m2: -2, fb1: "你利用軍需訂單為藉口，成功保住了這批員工。他們對你感激涕零，你成為了他們的再生父母。", fb2: "你默默看著員工被卡車載走。工廠因勞力短缺而停擺，你也因無法交付訂單遭到軍方調查。" },
        { id: "G17", text: "G17\n約書亞是看守奧斯維茲集中營的士兵。某天離開營區時，被一位老人攔住，表示願意以金錢為代價，請求他幫忙將信件、衣服轉交給另一猶太工人，並為他攜帶回信。\n你是否會願意冒著被人發現，甚至被射殺的風險提供協助？", opt1: "是，助人又可獲得金錢", opt2: "否，自己的生命更重要", s1: -2, m1: 2, s2: 2, m2: -2, fb1: "你成功傳遞了信件並獲得封口費。你發現原來在地獄般的集中營裡，金錢還能買到一點點人性。", fb2: "你粗暴地推開老人。在這種吃人的環境裡，任何一絲同情都可能成為送命的導火線。" },
        { id: "G18", text: "G18\n保時捷是德國頂尖汽車生產公司。二戰時納粹政府要求協助設計坦克車，並將汽車工廠轉型成武器工廠，還提供猶太人作為廉價勞力。\n如果你是保時捷老闆，你會接受政府的提議嗎？", opt1: "是，趁戰爭賺取大筆財富", opt2: "否，不打算取得不義之財", s1: 1, m1: -1, s2: -1, m2: 1, fb1: "你的兵工廠日夜趕工，賺取了驚人的財富。戰後，你不得不面對剝削奴工的嚴厲指控。", fb2: "你拒絕轉型為武器工廠。政府立刻沒收了資產並將你驅逐出境，你失去了一切但問心無愧。" },
        { id: "G19", text: "G19\n卡蘿拉是德國12歲中學生，「種族學」課程教導了猶太人是劣等人種。還曾目睹猶太人不需要任何原因，就被綁在椅上受皮鞭責打。\n如果你是卡蘿拉，看到這種場景，會有甚麼反應？", opt1: "是，他們本就是低賤人種，處罰是應得的", opt2: "否，找同學討論並質疑這行為的合理性", s1: 1, m1: -1, s2: -1, m2: 1, fb1: "你對暴力習以為常，完全融入了納粹青年團的狂熱。你的思想已徹底被仇恨所吞噬。", fb2: "你向同學表達了質疑卻被告發。你遭到老師嚴厲的體罰，並被列為思想危險份子。" },
        { id: "G20", text: "G20\n艾希曼將匈牙利44萬名猶太孩童、婦女送進毒氣室。眾多納粹官員為了搶功而想要擔任先鋒，積極去爭取這項「血腥」的任務。\n如果你是納粹官員，你是否會去爭取這個任務？", opt1: "是，搶先立功可以過更好生活", opt2: "否，協助大屠殺是不道德行為", s1: 1, m1: -1, s2: 0, m2: 1, fb1: "你積極參與這場大屠殺獲得了豐厚物資，但每晚閉上眼，都是毒氣室門上絕望的抓痕。", fb2: "你以生病為由推託了任務。雖然失去了晉升機會，但你慶幸自己的雙手沒有沾滿鮮血。" },
        { id: "G21", text: "G21\n埃里希曾是德國海軍元帥，因與希特勒發生戰術上的爭執，被解除元帥職位。隨著戰況惡化，一群軍官計畫推翻希特勒，於是邀請埃里希加入。\n如果你是埃里希，你會選擇加入推翻計畫嗎？", opt1: "是，反正有可能性命不保", opt2: "否，需保持對國家的忠誠", s1: -2, m1: 0, s2: 2, m2: 0, fb1: "你加入了密謀集團。政變失敗後你面臨殘酷審問與死刑，但你為國家盡了最後的努力。", fb2: "你選擇繼續效忠。儘管戰況一敗塗地，你保住了軍階，直到帝國崩塌的那一刻成為戰犯。" },
        { id: "G22", text: "G22\n里芬斯塔爾是女性電影導演，作品深受希特勒喜愛。但金援拍片的條件是必須為希特勒拍攝形象影片，宣傳他與日耳曼民族的偉大，以及猶太人的邪惡。\n如果你是里芬斯塔爾，你會接受元首的條件嗎？", opt1: "是，得到金援才能有所成就", opt2: "否，藝術不應沾染政治色彩", s1: 0, m1: -1, s2: 0, m2: 1, fb1: "你的電影成為納粹宣傳的曠世巨作，名利雙收，戰後卻永遠背負著「希特勒御用導演」的罵名。", fb2: "你拒絕為政治服務，隨即遭到封殺，終生無法再執導筒，但你保住了作為藝術家的純粹。" },
        { id: "G23", text: "G23\n為了毫無顧忌地實施「解決方案」，必須先修改法律規範讓猶太人失去參政權、工作權、財產權甚至國籍。\n如果你是一位法學專家，你是否會無視自身法學素養，配合政府制定法案？", opt1: "是，我不做也會有別人做", opt2: "否，這違背我的職業道德", s1: 1, m1: -2, s2: -1, m2: 2, fb1: "你親手起草了剝奪猶太人權利的法案。你攀上了法學界的巔峰，卻將法治精神踐踏在腳下。", fb2: "你堅守法理拒絕背書，隨即被吊銷執照。雖然生活陷入困頓，但你的靈魂沒有被權力收買。" },
        { id: "G24", text: "G24\n倪慕樂牧師反抗納粹干涉教會與信仰的自由，因此他先被禁止發表言論，之後被捕。刑期屆滿卻未被釋放，在集中營滯留，直至戰爭結束。\n如果是你，願意為宗教信仰自由反抗政府當局嗎？", opt1: "是，一切應歸於耶穌基督", opt2: "否，上帝會明白我的困境", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你的講道激勵了無數教徒，但也引來蓋世太保的逮捕。你在集中營受盡折磨，信仰卻愈發堅定。", fb2: "你選擇沉默以保全教會運作。教堂依舊敞開，但裡面的十字架已被萬字旗的陰影所籠罩。" },
        { id: "G25", text: "G25\n1943年納粹開始逮捕德國女人的猶太裔丈夫。她們聚集於玫瑰街猶太人安置所門前，要求釋放她們的丈夫。軍人威脅開槍，但她們毫不退讓，持續抗議。\n如果你的猶太丈夫突然被監禁，你會進行抗議嗎？", opt1: "是，走上玫瑰街抗議，自己的男人自己救", opt2: "否，認同政策，接受命運", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你們的堅持奇蹟般地迫使納粹讓步，丈夫重獲自由！這是極權統治下罕見的人性勝利。", fb2: "你眼睜睜看著丈夫被帶走，從此音訊全無。獨自苟活的你，餘生都被深沉的懊悔所折磨。" },
        { id: "G26", text: "G26\n施丁騰堡伯爵是德國外交官，家世顯赫。他厭惡納粹，拒絕擔任政府公職。運用自己的影響力協助猶太學生申請獎學金留學英國，幫助猶太人移民國外。\n如果你是納粹時期的外交官，當你發現伯爵的作為，是否願意冒著風險協助他？", opt1: "是，會竭盡所能去幫助他", opt2: "否，不願意犧牲官場前程", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你利用外交特權暗中幫忙，成功送走了一批留學生。雖然冒險，但這份跨國善意挽救了無數未來。", fb2: "你裝作不知情，繼續參加高級晚宴。你的仕途一帆風順，但內心的冷漠讓你與行屍走肉無異。" },
        { id: "G27", text: "G27\n1944年史陶芬保上校曾企圖引爆炸彈炸死希特勒，但未成功，導致「華爾奇麗雅行動」未能啟動，使政變走向失敗。\n若你身為納粹軍官將領，你是否會參與 720 密謀案？", opt1: "是，為國家著想，無法認同希特勒理念", opt2: "否，保有個人地位才算是最重要的事情", s1: -2, m1: 0, s2: 2, m2: 0, fb1: "炸彈未能殺死希特勒。你被捕並面臨極刑，但在絞刑架前，堅信自己站在了歷史正確的一方。", fb2: "你拒絕加入政變。你安穩活到了戰後，卻對當年國家陷入毀滅時未曾挺身而出感到羞愧。" },
        { id: "G28", text: "G28\n白玫瑰運動是由慕尼黑醫學院大學生組成，他們透過發送傳單，呼籲人們反抗希特勒。不久後，成員都被處死。然而傳單被大量印刷祕密送出德國，透過同盟國飛機散布各地。\n若你拾獲傳單，你是否願意將它傳遞出去？", opt1: "是，我願意傳遞學生理念", opt2: "否，我不願意冒生命風險", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你將傳單偷偷塞進鄰居的信箱。這份微小的勇氣，成為了反抗極權統治的星星之火。", fb2: "你驚恐地將傳單撕碎沖進馬桶。恐懼讓你選擇了服從，也讓你成為了沉默的共犯。" },
        { id: "G29", text: "G29\n德國相機品牌「萊卡」主席萊茲二世，二戰時雇用大量猶太人，並以派任海外為由將猶太人送離德國，被稱為「萊卡自由列車」。數百人因他而被拯救。\n若你是萊茲二世，會進行「自由列車行動」嗎？", opt1: "是，竭盡所能幫助猶太人", opt2: "否，與納粹保持良好關係", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "「自由列車」成功發車，數百名猶太員工因此獲救。你的義舉將在品牌歷史上留下最光輝的一頁。", fb2: "你中止救援行動以換取納粹的信任。相機大賣，但鏡頭下的世界卻充滿了血腥與暴力。" },
        { id: "G30", text: "G30\n木匠艾爾塞對納粹作為反感，決心刺殺希特勒。他利用希特勒每年會到慕尼黑啤酒館發表演說的機會，預先裝設炸彈。但因希特勒提前離開，而未能成功。\n如果你是艾爾塞，你是否仍會執行暗殺行動？", opt1: "是，炸死希特勒才能拯救德國", opt2: "否，小人物無法對抗強權", s1: -2, m1: 1, s2: 2, m2: -1, fb1: "雖然暗殺失敗並付出了生命，但你以一介平民之姿挑戰獨裁暴君的勇氣，將永遠流傳。", fb2: "你默默拆除了炸彈。戰爭繼續無情地絞殺千萬人，你也只能在無力感中嘆息。" },
        { id: "G31", text: "G31\n納粹佔領波蘭時，把動物園改為養豬場。札賓斯基夫婦被允許到猶太區收廚餘餵豬，趁機把猶太人私運出來，藏在獸檻、鳥籠、獅舍，並協助猶太人逃往安全地區。\n如果是你，是否會像札賓斯基夫婦救助猶太人？", opt1: "是，善行是人類永恆價值", opt2: "否，明哲保身是唯一選擇", s1: -2, m1: 2, s2: 1, m2: -2, fb1: "你把猶太人藏進獸檻、鳥籠與獅舍，藉著餵豬的名義，一批批送他們逃往安全地區。每一次查驗，你都提心吊膽，卻從未後悔。", fb2: "你選擇袖手旁觀。動物園裡只剩豬的嚎叫聲，但那些被你忽視的求救眼神，成為你心中揮之不去的重量。" },
        { id: "G32", text: "G32\n1933年德國大學生組織(DST)成員衝進「猶太博物館」，把猶太裔學者包括佛洛依德和愛因斯坦等人的著作都焚燒殆盡。\n若你是當時德國大學生，你是否會參與焚書運動？", opt1: "是，反猶是國家政策，支持焚燒著作", opt2: "否，學術文化不應該存在有種族差別", s1: 1, m1: -1, s2: -1, m2: 1, fb1: "你高舉火把加入同學的行列，火光映紅了你的臉。你被視為「忠誠的青年」，卻親手焚毀了人類知識的瑰寶。", fb2: "你站在人群外圍沒有動手。同學投來質疑的目光，你被貼上「不合群」的標籤，但保住了對知識的敬意。" },
        { id: "G33", text: "G33\n1938年，猶太青年格林斯潘因反對猶太人被逐出德國，槍殺了高官，此事成為納粹採取暴力的藉口。之後，蓋世太保對猶太人住宅、商店、教堂徹底破壞，被稱為「水晶之夜」。\n若你是德國年青人，你是否會參與「水晶之夜」的暴力行為？", opt1: "是，響應政府反猶政策", opt2: "否，不願捲入政治操弄", s1: 1, m1: -2, s2: -1, m2: 1, fb1: "你跟著人群砸碎櫥窗、闖進猶太人的店鋪。黨部肯定了你的「熱情」，但隔天面對滿街碎玻璃，你知道自己做了什麼。", fb2: "你拒絕加入暴行，轉身離開現場。同伴嘲笑你是懦夫，還記下了你的名字，但你的雙手是乾淨的。" },
        { id: "G34", text: "G34\n奧古斯特為獲得造船廠工作加入納粹黨，但他愛上猶太人艾爾瑪後，堅持與她結婚。《紐倫堡法案》公布後，這段婚姻被視為非法，他被判「玷污種族」罪名而被送入集中營。\n如果你是奧古斯特，並能預知你的命運，是否決定與猶太妻子結婚？", opt1: "是，仍與猶太人結婚", opt2: "否，決定放棄艾爾瑪", s1: -2, m1: 2, s2: 1, m2: -1, fb1: "你選擇與艾爾瑪結婚。《紐倫堡法案》生效後，你因「玷污種族」罪被送入集中營，但你從未後悔愛過她。", fb2: "你含淚放棄了艾爾瑪，保住了自由與工作。但每當路過猶太人的住處，你都不敢抬起頭。" },
        { id: "G35", text: "G35\n弗萊斯勒是法官，負責審理對抗希特勒獨裁政權的活動。他喜愛作秀式地公開審訊，並處以犯人極刑。1942-1945年間，5000件死刑案中，超過半數是由弗萊斯勒的法庭所判。\n若你是當時的法官，是否敢批評弗萊斯勒的作法？", opt1: "是，法律不應為政權服務", opt2: "否，極權下個人無從選擇", s1: -2, m1: 2, s2: 1, m2: -1, fb1: "你在法庭上公開質疑弗萊斯勒的審判。你的法官職務立刻被撤銷，你成為政治犯，但你的話在沉默的法庭裡久久迴盪。", fb2: "你低頭沉默，看著一份份死刑判決被簽下。你保住了職位與性命，但每一次敲槌聲，都像在你耳邊迴響。" }
    ];

    const jCards = [
        { id: "J01", text: "J01\n有位猶太人回憶，為求盡快逃出危險的猶太隔離區以躲過死劫。於是考慮洗劫「猶太委員會」錢箱，讓自己能在短時間內弄到足夠的金錢。\n你是否會為了逃離隔離區而搶劫與納粹政權親近的「猶太委員會」？", opt1: "是，我願意為生存去冒險", opt2: "否，我不願搶劫導致別人的損失", s1: 1, m1: -1, s2: -1, m2: 1, fb1: "你成功拿到一筆逃命錢，但無辜的委員會成員卻因帳目不符遭到納粹嚴厲處決。", fb2: "你守住了道德底線，但在隨後的突襲檢查中，你因繳不出賄賂金而被強行送上遣送列車。" },
        { id: "J02", text: "J02\n學醫的猶太人回憶：「曾經在納粹的要求下，切下健康女孩的肉，把侏儒、殘疾人的身體用化學溶液保存。目的是放入帝國博物館，讓後代理解滅絕猶太人的行為是正當的。」\n若你擁有醫學背景被聘為集中營醫生，你是否願意執行解剖活體的任務？", opt1: "是，為了生存願意執行", opt2: "否，拒絕任務，無法接受殘忍對待同胞", s1: 1, m1: -2, s2: -1, m2: 2, fb1: "你強忍作嘔完成了手術。納粹軍官滿意地丟給你一塊麵包，你活下來了，但靈魂已經死去。", fb2: "你斷然拒絕了褻瀆的任務。你隨即遭到毒打並被丟入毒氣室，但你保住了醫生的尊嚴。" },
        { id: "J03", text: "J03\n猶太人遭受歧視的氛圍下，最慘的是猶太小孩。亞利安小孩會毆打他們，有些猶太人為了救小孩，不顧危險幫忙解圍，好讓猶太小孩有機會逃脫。\n如果你見到猶太小孩被毆打，是否願意伸出援手解救他們？", opt1: "是，願意對小孩伸出援手", opt2: "否，擔心受牽連不願介入", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你拼死擋下拳頭救走小孩。雖然自己被打得遍體鱗傷，但孩子的眼神給了你活下去的希望。", fb2: "你低著頭快步走開。背後傳來孩童淒厲的哭聲，那聲音成為你日後無數個夜晚的夢魘。" },
        { id: "J04", text: "J04\n地鐵、街上，會有不認識的人靠近猶太人，放些東西到大衣口袋，像是蘋果、肉等，大多是猶太人不能取得的物資。\n在猶太人被限制物資來源的情況下，你是否會將無法公開取得的物資分享給猶太人？", opt1: "是，願意提供猶太人物資", opt2: "否，物資有限，無法分享", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你將偷來的蘋果分給素不相識的同胞。這份微薄的卡路里，或許就是他撐過嚴冬的關鍵。", fb2: "你捂緊口袋假裝沒看見飢餓的眼神。你保全了體力，但在這座冰冷的城市裡感到前所未有的孤獨。" },
        { id: "J05", text: "J05\n1939年大學、科學機構，被要求解雇猶太人。同時猶太人亦被禁止出入公共場所、 參加體育比賽、擁有汽車牌照、電話和收音機。\n你若是被解雇的一員，是否會挺身抗議不平等法律？", opt1: "是，我願意挺身抗議不公", opt2: "否，我不願意冒生命危險", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你的抗議換來了警棍的毒打與即刻逮捕。你在監獄中受盡折磨，但勇氣鼓舞了其他受壓迫者。", fb2: "你默默收拾紙箱離開了工作多年的機構。你保全了性命，卻失去了知識份子的傲骨與尊嚴。" },
        { id: "J06", text: "J06\n克羅赫瑪是比利時猶太人，1943年他與1900人一起被移送到奧斯威辛集中營的路上。途中有3名年輕人阻止了死亡列車前進，拯救231條人命。\n如果你也在現場， 是否願意和年輕人們一起阻止死亡列車的前進呢？", opt1: "是，拯救人命是最重要的", opt2: "否，我害怕遭到納粹報復", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你趁亂協助拔掉列車插銷，成功讓數百人逃入森林！雖然立刻遭到追捕，這是絕望中的偉大勝利。", fb2: "你瑟縮在車廂角落不敢動彈。抗議很快被機槍鎮壓，列車重新啟動駛向死亡營。" },
        { id: "J07", text: "J07\n葛柏是奧斯威辛集中營猶太人囚工，負責把猶太人屍體從毒氣室拉出來，再塞進焚屍爐火化。在黨衛軍的監視下，他必須取出受害者的值錢物品和金牙，然後再把屍體塞進焚燒爐。\n如果你是葛柏，是否願意擔任這項工作？", opt1: "是，不計一切為求生存", opt2: "否，我不願當納粹幫凶", s1: 1, m1: -1, s2: -1, m2: 1, fb1: "你在屍堆中麻木地拔取金牙，換取了額外配給。你活得比別人久，但每天都在地獄最深處煎熬。", fb2: "你拒絕觸碰同胞的遺體。納粹毫不猶豫地扣下扳機，你結束了短暫卻保持純潔的一生。" },
        { id: "J08", text: "J08\n鄰居門口站著兩位高大納粹，他們問：「霍恩斯坦太太是不是住在這裡？」結果她就被帶走了。我思考著是否應該通知她的女兒？但猶太人無法使用電話、夜晚又被禁止外出。\n若是你，是否會冒著被納粹捕捉的風險， 去告知霍恩斯坦太太的家人？", opt1: "是，願意冒險通知其家人", opt2: "否，無法接受被捕的風險", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你冒著宵禁被擊斃的風險成功通知了她的女兒。他們及時逃亡，這份恩情永生難忘。", fb2: "你躲在窗簾後瑟瑟發抖。隔天她的家人也被蓋世太保一網打盡，你對自己的懦弱感到無比痛心。" },
        { id: "J09", text: "J09\n「水晶之夜」使柏林成為人間煉獄，衝鋒隊在深夜以斧頭、長刀敲碎猶太商店的櫥窗玻璃。一對猶太夫婦木然看著，卻有人喊：「猶太人滾！」太太回嗆：「你這該死的豬！」先生面色慘白：「天啊～別再說了！」\n如果是你，你會如何面對這場災難與羞辱？", opt1: "是，出面指責亞利安人", opt2: "否，選擇閉嘴息事寧人", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你的怒吼引來了衝鋒隊的暴力圍毆，商店被徹底砸爛，但你發洩了長久以來的屈辱與憤怒。", fb2: "你吞下羞辱眼睜睜看著畢生心血化為烏有。你保住了性命，但民族的尊嚴在此夜被徹底粉碎。" },
        { id: "J10", text: "J10\n長居英國的猶太人只能收容一位家族成員，並需繳交高額保證金。最終，父親決定獨自飛往英國接受庇護，留下女兒與太太在混亂的德國。\n若是你擁有逃往英國的機會，是否會選擇拋下家人獨自前去英國接受庇護？", opt1: "是，能前往英國機會難得", opt2: "否，家人團聚比較安心", s1: 1, m1: -1, s2: -1, m2: 1, fb1: "你獨自登上前往英國的飛機。你逃過了屠殺，但終其一生都在為了拋棄家人而深深自責。", fb2: "你撕毀機票選擇與家人共存亡。幾個月後你們一同被送入集中營，但至少你們沒有分開。" },
        { id: "J11", text: "J11\n凱明斯基擁有偽造護照的專業技術，他協助猶太人製造假護照，以避免被送至集中營。但此舉同時也讓他自己陷入危機。\n如果你是凱明斯基，你會幫助猶太人製作假證件嗎？", opt1: "是，努力製造護照，盡可能幫助更多人", opt2: "否，自己的安全最重要，選擇獨善其身", s1: -1, m1: 2, s2: 1, m2: 0, fb1: "你的假護照讓數十個家庭逃出生天。雖然最終被識破並遭到嚴刑拷打，但你覺得一切都值得。", fb2: "你銷毀了所有工具斷絕聯絡。你成功隱蔽了自己，卻也切斷了許多同胞最後的生機。" },
        { id: "J12", text: "J12\n馬賽琳是一名13歲小女孩，在集中營裡負責拉馬鈴薯貨車。與她合作的另一個小女孩，因過度勞動與營養不良已奄奄一息。馬賽琳會偷留下馬鈴薯，讓她補充營養，維持體力。\n如果你是馬賽琳，你也會這樣幫助小女孩嗎？", opt1: "是，想辦法偷取馬鈴薯，補充她的營養", opt2: "否，無視她的身體狀況", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你冒著被警犬咬死的危險偷藏馬鈴薯。女孩因這份食物奇蹟般撐了下來，你們成為生死之交。", fb2: "你別過頭去專心拉車。幾天後那個小女孩的床位空了，你默默告訴自己：這就是集中營的日常。" },
        { id: "J13", text: "J13\n安妮・法蘭克為逃避查緝，和6名猶太人躲藏在密室，密室的空間尚可容納1人。此時，附近有位猶太人遭到追捕，密室裡7人開會討論是否要讓他進入密室。\n如果你是安妮・法蘭克，你是否會冒險收容這位逃亡的猶太人？", opt1: "是，同為猶太人就應該伸出援手", opt2: "否，人多被發現的風險就更高了", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你們擠出空間收容了他。雖然空氣更渾濁、食物更匱乏，但你們多救了一條人命閃耀人性光輝。", fb2: "你們含淚將他拒之門外。不久後樓下傳來逮捕的腳步聲，你們安全了，但密室充滿了罪惡感。" },
        { id: "J14", text: "J14\n史羅因在集中營時，因擁有修理水電技術，可自由來回於兩個看守營區。一位猶太人託他將親筆信和節省下來的食物，交給在另一個營區的7歲女兒。\n如果你是史羅因，你會幫助這位猶太同胞嗎？", opt1: "是，一定將食物與信親手交給他的女兒", opt2: "否，假裝答應他，但把信燒了留下食物", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你冒死穿越營區將信與食物塞給女孩。女孩微弱的笑容，成為你在這地獄中見過最美的畫面。", fb2: "極度的飢餓讓你失去理智，你吞下了食物並燒毀信件。你多活了幾天，卻徹底喪失了人性。" },
        { id: "J15", text: "J15\n納粹黨員沃納有一個猶太情人伊迪斯，沃納想要與伊迪斯完成合法婚姻程序，以生養孩子。官方提出的條件是伊迪斯必須更改信仰，並進行基督教婚禮。\n若你是伊迪斯，你會願意為生存改變猶太人信仰嗎？", opt1: "是，我願意改信，這樣才能活下去", opt2: "否，不願意，不能放棄猶太人信仰", s1: 1, m1: -1, s2: -1, m2: 1, fb1: "你受洗完成了婚禮獲得暫時的合法身份，但內心對背叛祖先信仰感到無比痛苦。", fb2: "你堅定地拒絕了。婚禮被取消，你隨即被列入遣送名單，但你帶著猶太人的驕傲走入黑暗。" },
        { id: "J16", text: "J16\n一批辛德勒工廠的猶太工人正在集合，我獨自走到負責軍官面前說：「我應該在名單上，不知為何把我刪掉了？」軍官點頭示意我加入工人的行列，我終於脫離了地獄。\n若你看到進入辛德勒工廠的機會，是否敢冒險一試？", opt1: "是，這是活著與家人團聚的機會", opt2: "否，冒險行事可能會喪失生命", s1: -1, m1: 0, s2: 1, m2: 0, fb1: "你大膽的謊言竟然奏效了！你成功混入辛德勒的名單，這是你人生中最幸運的一次豪賭。", fb2: "你恐懼地退回人群中。錯失了這次機會，隔天你被推上了前往奧斯威辛的死亡列車。" },
        { id: "J17", text: "J17\n開往集中營的火車上，每節車廂載滿80人，每人僅能攜帶幾塊麵包。車門被封死，車廂各指派一位廂長協助管理，如果有人逃脫，廂長就會被槍決。\n若是你被指派為廂長，火車突然出軌，你會把握機會帶著同車的人逃亡嗎？", opt1: "是，把握大家活命的機會", opt2: "否，一旦被抓我就完蛋了", s1: -2, m1: 2, s2: 2, m2: -2, fb1: "你帶領整節車廂砸破木板衝入黑夜！雖然背後槍聲大作，但你們終於呼吸到了自由的空氣。", fb2: "你為了自保死守車門不讓任何人離開。德軍很快控制局面，你保住了位置卻被同胞唾棄。" },
        { id: "J18", text: "J18\n女記者露德與她的朋友們，替躲藏的猶太人、政治犯張羅了住處與食物配給卡，讓他們在藏身之處不致挨餓受凍。\n若你也認識露德，是否會願意分享食物給這些躲藏著的猶太人呢？", opt1: "是，自己少吃一點無所謂", opt2: "否，戰爭時物資短缺，擔心自己的溫飽就夠了", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你省下口糧送往藏身處。那些政治犯與猶太人因你的接濟而存活，你成為了無名英雄。", fb2: "你拒絕了請求。幾週後，藏身處的人因飢餓被迫外出覓食而全數被捕，你為此深感內疚。" },
        { id: "J19", text: "J19\n集中營的工頭發現一個男孩嘴巴裡有金牙套，要求男孩交出。工頭惡狠狠地說：「如果不交出牙套，你將付出慘痛代價！」從此每天毆打男孩的父親。\n如果你是男孩，看著父親天天遭人痛打，會不會交出金牙套呢？", opt1: "是，為了父親交出金牙套", opt2: "否，金牙套可以換取食物", s1: -1, m1: 1, s2: 1, m2: -1, fb1: "你交出了金牙套，雖然保住了父親免受挨打，但你們的物資更加匱乏了。", fb2: "你保留了金牙套換取食物維持體力，但父親卻因此受盡折磨，這份愧疚將伴隨你一生。" },
        { id: "J20", text: "J20\n有少數猶太人趁著遭遇空襲時，企圖逃離集中營，但失敗且被當場判刑，以儆效尤。營長用兩碗湯作為交換條件，徵求兩名集中營囚犯協助執行死刑。\n你長久以來都處於飢餓狀態，要把握住這個機會嗎？", opt1: "是，死刑不是我判決的，我只是協助執行而已", opt2: "否，雖然餓了很久，還是不忍心下手結束生命", s1: 1, m1: -1, s2: -1, m2: 1, fb1: "你為了一碗湯踢開了同胞腳下的木桶。熱湯下肚你活下來了，但所有囚犯看你的眼神充滿鄙夷。", fb2: "你強忍飢餓拒絕了營長的誘惑。雖然餓得發昏，但你保住了在集中營裡極度稀缺的道德底線。" },
        { id: "J21", text: "J21\n集中營裡一位猶太父親忽然肚子痛，他走向警衛：「對不起，能否告訴我廁所在哪裡？」警衛從頭到腳打量他，突然重重賞給這位父親一記耳光。\n如果你是這位父親的兒子，目睹一切，你會奮力保護自己的父親嗎？", opt1: "是，衝上前去揍警衛一頓", opt2: "否，假裝沒看到這一幕以保全自己", s1: -1, m1: 2, s2: 1, m2: -2, fb1: "你發瘋似地將警衛撲倒！雖然立刻遭到毒打並關禁閉，但你保護父親的舉動震撼了所有囚犯。", fb2: "你死死咬住嘴唇看著父親倒在血泊中不敢出聲。你的理智保住了性命，但心靈早已千瘡百孔。" },
        { id: "J22", text: "J22\n一名猶太女子在德軍佔領期間取得偽造文件，宣稱自己是亞利安人，躲過送進集中營的命運。\n你在無意之間發現了這位女子的真實身分，你會向上級報告嗎？", opt1: "是，誠實舉報可以換得比現在更好的待遇", opt2: "否，這不干我的事，何況救人一命是好事", s1: 1, m1: -1, s2: -1, m2: 1, fb1: "你為換取半條香腸向蓋世太保告密。那名女子當天就被逮捕，你的背叛讓你成為了納粹走狗。", fb2: "你裝作沒看見，甚至暗中幫她掩護。在這個隨時會死的年代，你選擇讓世界多一份善意存留。" },
        { id: "J23", text: "J23\n集中營的監工身邊會有貼身「小助手」，由年紀較小的男孩擔任，他們卻比大人更殘忍。一名13歲小助手，因為自己父親未妥善整理床舖而出手痛打。\n你目睹這個情景，會出手阻止這名小助手嗎？", opt1: "是，提醒小助手：「這是你的父親！」", opt2: "否，裝作沒看到", s1: -1, m1: 2, s2: 1, m2: -2, fb1: "你的厲聲喝斥讓小助手愣住了，他羞愧地停下手。你冒險喚醒了他被極權洗腦的殘存人性。", fb2: "你麻木地看著這場家庭悲劇上演。在集中營裡權力與暴力早已扭曲了一切，你無力改變。" },
        { id: "J24", text: "J24\n集中營定期會舉行「淘汰競選」，猶太人必須全身脫光向前奔跑。此時，黨衛軍則將無法奔跑或是體力虛弱的猶太人，送入焚化爐。\n你年邁的父親或許將無法通過淘汰競選，你會想辦法幫助他嗎？", opt1: "是，陪在他身邊，協助他努力向前衝", opt2: "否，以後就不需要再把麵包分給他了", s1: -1, m1: 2, s2: 1, m2: -2, fb1: "你架著父親奮力跑過了終點線！雖然雙雙累倒，但你們成功躲過了毒氣室的挑選相擁而泣。", fb2: "你冷漠甩開父親的手獨自奔向終點。你在活人區看著他被推向焚化爐，為了生存你拋棄了親情。" },
        { id: "J25", text: "J25\n戰爭末期物資缺乏，集中營囚犯領不到食物，只能靠吃雪過活。好心工人會扔些麵包給囚犯，幾十個飢民為了麵包一團混戰，一位老人撿到一塊麵包……\n你也在現場，你會搶下老人手上的麵包嗎？", opt1: "是，既然大家都在搶，就逼迫老人交出麵包", opt2: "否，老人運氣太好了，摸摸鼻子繼續挨餓吧", s1: 1, m1: -2, s2: -1, m2: 1, fb1: "你仗著力氣硬生生摳出老人手裡的麵包。你嚥下食物延續了生命，卻也吃下了罪惡。", fb2: "你收回了伸出的手。老人感激地看著你，雖然依然飢腸轆轆，但你證明了自己還是個人。" },
        { id: "J26", text: "J26\n集中營裡，病重的猶太父親已極度虛弱，營長對兒子說：「給你個建議，別再把你的麵包留給你父親，你應該吃下他的食物，才能存活下來。」\n如果你是這位父親的兒子，你會聽從營長的建議嗎？", opt1: "是，自己吃才能存活下來", opt2: "否，堅持要延續父親生命", s1: 1, m1: -2, s2: -1, m2: 2, fb1: "你狠下心拿走了父親的配給。你活了下來，但營長那句「你做得對」成為你一生揮之不去的詛咒。", fb2: "你無視營長的嘲諷，將最後一口麵包餵給父親。雖然他最終離世，但他在你懷抱中安詳閉眼。" },
        { id: "J27", text: "J27\n1933年《重設公職人員法》規定：「非亞利安人血統的公職人員沒有退休資格」有超過1,200名猶太教授、助教遭無故解聘，經濟頓失依靠，淪為無業游民。\n你是否願意為了家中經濟，去重新學習手藝，成為皮匠或鞋匠？", opt1: "是，去學習一技之長，養活全家人比較實際", opt2: "否，工匠地位太低了，怎麼能為五斗米折腰", s1: 1, m1: 0, s2: -1, m2: 0, fb1: "你放下教授身段學會修鞋。這門粗活養活了家人，甚至讓你在集中營因擁有技能而免於一死。", fb2: "你堅持知識份子的尊嚴拒絕勞動。隨著積蓄耗盡家庭陷入絕境，最終只能依靠救濟苟活。" },
        { id: "J28", text: "J28\n集中營裡，即將死去的猶太父親不斷呼喚兒子的名字，希望兒子可以在臨終之際陪伴在身邊，卻換來黨衛軍憤怒地用棍子毆打。\n你知道父親在呼喚你，你會回應他的要求嗎？", opt1: "是，衝到他身邊，握著他的手，令他安心", opt2: "否，太害怕被毆打，任由父親垂死掙扎", s1: -1, m1: 2, s2: 1, m2: -2, fb1: "你冒著棍棒交加緊緊握住父親的手。他在你的呼喚中平靜離世，而你被打斷了兩根肋骨。", fb2: "你恐懼地捂住耳朵不敢跨出隊伍。父親在孤獨與絕望中嚥下最後一口氣，成為你一生的痛。" },
        { id: "J29", text: "J29\n畢爾斯基四兄弟，在納粹追捕中逃進了原始森林，父母和其他家庭成員都不幸遇難。他們開始著手組織反抗軍對抗納粹軍隊。\n如果你是畢爾斯基兄弟，是否會選擇組織武裝部隊進行反抗？", opt1: "是，也許有機會拯救其他猶太人", opt2: "否，好不容易逃跑，應該躲起來", s1: -2, m1: 1, s2: 2, m2: -1, fb1: "你們成功建立起強大的森林游擊隊，不僅重創德軍，更庇護了上千名逃亡的猶太同胞！", fb2: "你們選擇在防空洞中苟且偷生。避開了戰火，但也錯失了反抗納粹、拯救同胞的最佳時機。" },
        { id: "J30", text: "J30\n一對姊妹被命令搬入猶太區時不願服從，坐在路邊泣不成聲。路過的波蘭人聽到哭聲，心生憐憫，把她們藏入農場，兩人因此倖存下來。\n你會順從搬遷命令嗎？你不一定會有她們的幸運喔？", opt1: "是，不服從命令會招致危險！", opt2: "否，要自行決定命運！", s1: 1, m1: 0, s2: -1, m2: 0, fb1: "你乖乖搬入了擁擠骯髒的隔離區。每天面臨飢餓與疾病的威脅，命運徹底掌控在納粹手中。", fb2: "你趁亂躲進了鄉間農場的草垛中。你成功避開了隔離區的地獄，展開了艱難的逃亡生涯。" },
        { id: "J31", text: "J31 機會卡\n二戰初期，何鳳山擔任中國駐維也納領事。他不忍心猶太人處境，發放猶太人前往中國的生命簽證，一共救助2000多人。\n2000年，他被以色列政府授予「國際義人」稱號，並在耶路撒冷紀念碑為其刻下「永遠不能忘記的中國人」。\n你是住在維也納的猶太人，幸運取得何鳳山發放的「生命簽證」逃亡中國。", type: "chance", opt1: "領受這份幸運", s1: 1, m1: 0, fb1: "憑著那張「生命簽證」，你踏上前往中國的旅程，離開了越來越危險的歐洲。" },
        { id: "J32", text: "J32 機會卡\n荷蘭小鎮哈林的一家鐘錶店，樓上房間的衣櫃夾層就藏匿著一批猶太人。\n店主布姆幫助800多位猶太人和地下反抗成員逃生。\n1944年納粹逮捕了布姆，但納粹並沒有抓到密室裡的猶太人和地下反抗成員。\n你是布姆的猶太人鄰居，藉由他的協助而逃過這場迫害。", type: "chance", opt1: "領受這份幸運", s1: 1, m1: 0, fb1: "鐘錶店樓上的密室悄悄守住了你的性命。納粹搜查時，滴答的鐘聲掩蓋了你屏住的呼吸。" },
        { id: "J33", text: "J33 機會卡\n在立陶宛的日本領事杉原千畝，發出數千張日本過境簽證，來拯救猶太人生命。但此舉違反了日本外交部指示，因為當時日本是納粹德國的盟友。\n據聞杉原千畝於離開立陶宛前，依然在火車站繼續簽發過境簽證。被問到動機，他說只是「出於對人類的愛」。\n你也拿到了一份日本簽證，因此逃出歐洲。", type: "chance", opt1: "領受這份幸運", s1: 1, m1: 0, fb1: "你緊握著那張過境簽證登上列車。窗外的歐洲漸漸遠去，你終於逃出了這片土地。" },
        { id: "J34", text: "J34 機會卡\n英國曾啟動「兒童救援」計畫，允許未滿17歲的猶太小孩到英國避難。\n溫頓在英國尋找願意收養小孩的家庭，並用8列火車，將669名兒童從捷克送往英國。這些「溫頓兒童」及其子孫，約有6000人因溫頓而得以存活。\n你是位15歲的猶太男孩，幸運獲得溫頓的協助得以前往英國。", type: "chance", opt1: "領受這份幸運", s1: 1, m1: 0, fb1: "火車駛離布拉格的那一刻，你回頭望了一眼。你在英國的新家庭裡，重新開始了生活。" },
        { id: "J35", text: "J35 機會卡\n德勒斯基是德國亞利安女孩，但她不願意在軍工廠工作，因此用相當低的價格賣掉了工作證。\n你身為猶太人，買到這一張假造的工作證，上方還印有納粹老鷹徽章。\n你因此擁有基本的收入與工作機會，在戰爭期間的柏林幸運存活下來。", type: "chance", opt1: "領受這份幸運", s1: 1, m1: 0, fb1: "那張印著老鷹徽章的工作證成了你的護身符。你靠它在柏林熬過了一個又一個艱難的日子。" }
    ];

    const endingsDB = {
        "G51": { title: "G51 卡爾·馮·奧西茨基 (1889-1938)", paras: ["德國記者，擔任週刊《世界舞台》總編輯，曾因揭露政府秘密建軍而被處以叛國罪，後獲特赦。希特勒上台後，仍持續批評德國的軍國主義和納粹主義。", "1933年，他再次被捕並送往關押政治異議人士的埃斯特韋根集中營，遭受殘酷的折磨與勞動。1936年獲得諾貝爾和平獎。納粹迫於國際壓力釋放他，但他在集中營時感染肺結核，兩年後病逝，享年48歲。"], url: "https://pse.is/9rrbec" },

        "G55": { title: "G55 沃爾夫岡·比克納 (1913-1945)", paras: ["德國黨衛隊軍官。德國入侵波蘭後，被調往華沙，在黨衛隊國家安全總局及華沙安全警察局任職。", "1941年，他率領由29名安全警察和蓋世太保組成的「比亞維斯托克突擊隊」，以清除蘇聯游擊隊為名，在波蘭東北部對當地猶太人進行屠殺，短短兩個月內就奪走至少1800名猶太人性命。", "1945年，戰爭結束前夕，他在波蘭境內陣亡，享年31歲。"], url: "https://pse.is/9rzydy" },

        "G62": { title: "G62 喬治·杜克維茲 (1904-1973)", paras: ["德國外交官，二戰期間在德國佔領下的丹麥擔任大使館專員。因他無法接受迫害猶太政策，故私下透露丹麥猶太人將被遣送的確切時間。於是丹麥民眾自發性動員，偷偷用漁船將7000多名猶太人載到中立國瑞典，讓丹麥國內95%的猶太人得到拯救。", "戰後，於1971年得到以色列政府褒揚為「國際義人」。享壽68歲。"], url: "https://pse.is/9rvmju" },

        "G67": { title: "G67 胡波圖斯·斯特拉胡德 (1898-1986)", paras: ["德國航空部門醫學家，在NASA的早期太空計劃貢獻良多，而被譽為「太空醫學之父」。", "二戰期間，曾利用猶太囚犯進行實驗。包括將囚犯置於低壓艙模擬高空缺氧環境，以及將其浸泡在冰水中進行極端低溫實驗，導致大量受害者痛苦死亡。", "戰後他被秘密帶往美國，在太空總署擔任高階職位。88歲過世後，進行人體實驗的事被公諸於世，自此名譽掃地，所有榮譽頭銜遭到撤銷。"], url: "https://pse.is/9s833t" },
        "G68": { title: "G68 奧斯卡·葛朗寧 (1921-2018)", paras: ["納粹親衛隊下士，因駐守奧斯威辛集中營，負責登記、整理從猶太人身上搜刮來的財產，並將其寄回柏林總部，而被稱為「奧斯威辛的帳房」。", "戰後，他隱姓埋名。直到四十年後，才公開承認並詳細講述他在集中營親眼見證了大規模屠殺的殘酷過程，以此駁斥那些否認歷史的言論。", "他被德國法庭以「協助謀殺」三十萬名猶太人，判處四年徒刑。但在入獄前病逝，享耆壽96歲。"], url: "https://pse.is/9s829j" },
        'J51': { title: 'J51 柯扎克 1879-1942年', desc: '「兒童人權之父」。拒絕逃亡，最終和孩子們在死亡集中營慘遭殺害。' },
        'J52': { title: 'J52 弗朗切斯卡曼恩 ?-1943年', desc: '波蘭芭蕾舞演員。在移送中奪槍反擊軍官，最終所有婦女遭機關槍掃射身亡。' },

        'J57': { title: 'J57 海倫娜 1920-1998年', desc: '加入游擊隊並混入德軍指揮部擔任秘書。戰後遭人誤解唾罵,身分釐清後才平反。' },

        'J60': { title: 'J60 米爾希 1892-1972年', desc: '漢莎航空第一任總經理,因父親是猶太人備受質疑,戰後被判終身監禁。' },
        'J61': { title: 'J61 魏什爾 1891-1982年', desc: '捷克記者,曾呼籲「驕傲地戴上黃色六芒星」,後來對此口號感到無比後悔。' },
        'J62': { title: 'J62 韋內齊亞 1923-2012年', desc: '「特遣隊」倖存者。撰寫回憶錄《奧斯威辛特遣隊》揭露納粹真實罪行。' }

    // ==========================================
    // 2. 全域狀態與工具模組
    // ==========================================
    
    // 玩家起始數值（生存 6：較貼近高壓的歷史處境；道德 10）
    const START_STATS = { survival: 6, moral: 10 };

    const GameState = {
        players: [],
        currentPlayerIndex: 0,
        currentRound: 1,
        cardPools: { 'A': [], 'J': [] },
        currentCard: null,
        
        initCardPools: function() {
            this.cardPools['A'] = GameUtils.shuffleArray(gCards);
            this.cardPools['J'] = GameUtils.shuffleArray(jCards);
        },
        
        drawCard: function(role) {
            if (this.cardPools[role].length === 0) {
                const originalPool = role === 'A' ? gCards : jCards;
                this.cardPools[role] = GameUtils.shuffleArray(originalPool);
            }
            return this.cardPools[role].pop();
        },
        
        getCurrentPlayer: function() {
            return this.players[this.currentPlayerIndex];
        }
    };

    const GameUtils = {
        shuffleArray: function(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        },
        switchStep: function(stepNum) {
            AudioController.playStepSound();
            document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`step-${stepNum}`).classList.add('active');
        },
        highlightKeywords: function(text) {
            if (!text) return "";
            const keywords = [
                '蓋世太保', '毒氣室', '水晶之夜', '集中營', '屠殺', '安樂死', '希特勒', '黨衛軍', 
                '焚屍爐', '焚化爐', '奧斯威辛', '奧斯維茲', '絞刑', '死刑', '死亡列車', '萬字旗', 
                '紐倫堡大審', '萊茵哈德行動', '生命源泉計畫', '總體戰', '衝鋒隊', '死亡集中營', 
                '叛國罪', '最終方案', '血腥', '滅絕', '死劫', '槍決', '毒打', '殘暴', '槍殺', '射殺', 
                '納粹', '極權', '法西斯', '大屠殺', '集中監管', '預防性拘留', '勞改場', '隔離區', 
                '猶太委員會', '特遣隊', '種族清洗'
            ];
            keywords.sort((a, b) => b.length - a.length);
            const regex = new RegExp('(' + keywords.join('|') + ')', 'g');
            return text.replace(regex, '<span class="highlight-term">$1</span>');
        }
    };

    const AudioController = {
        audioCtx: null, // 新增 Web Audio Context
        init: function() {
            document.body.addEventListener('click', () => this.unlockAudio(), { once: true });
            // 全站按鈕音效（選項按鈕由 showFeedback 播放確認音，換造型按鈕播放骰子聲）
            document.addEventListener('click', (e) => {
                const b = e.target.closest && e.target.closest('button');
                if (!b || b.disabled) return;
                if (b.classList.contains('option-btn')) return;
                if (b.classList.contains('reroll-btn')) { this.playDiceSound(); return; }
                this.playClickSound();
            }, true);
        },
        unlockAudio: function() {
            const bgMusic = document.getElementById('bg-music');
            const endingMusic = document.getElementById('ending-music');
            const gameOverSound = document.getElementById('game-over-sound');
            const btn = document.getElementById('music-toggle-btn');
            
            // 初始化 Web Audio API (需要使用者互動解鎖)
            try {
                if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
            } catch(e) {}

            [endingMusic, gameOverSound].forEach(audio => {
              try {
                audio.muted = true;
                const playPromise = audio.play();
                if (playPromise !== undefined) {
                    playPromise.then(() => {
                        audio.pause();
                        audio.currentTime = 0;
                        audio.muted = false;
                    }).catch(() => {
                        audio.muted = false;
                    });
                }
              } catch (e) { try { audio.muted = false; } catch (x) {} }
            });

            if (bgMusic.paused && !document.getElementById('step-4').classList.contains('active')) {
                try {
                    const pp = bgMusic.play();
                    if (pp && pp.then) pp.then(() => { btn.innerText = "關閉音樂"; }).catch(e => console.log("音檔需等待互動", e));
                    else btn.innerText = "關閉音樂";
                } catch (e) { console.log("背景音樂無法播放", e); }
            }

        // 安全播放：舊版手機瀏覽器的 play() 可能不回傳 Promise，或直接丟出錯誤
        safePlay: function(audio, onOk, onFail) {
            try {
                const pr = audio.play();
                if (pr && typeof pr.then === 'function') {
                    pr.then(function() { if (onOk) onOk(); }, function(e) { if (onFail) onFail(e); });
                } else if (onOk) onOk();
            } catch (e) { if (onFail) onFail(e); }

        // ==========================================================
        // 程式化合成音效（Web Audio API，不需任何外部音檔）
        // ==========================================================
        sfxVolume: 3.0, // 音效總音量倍率（1.0 為原始音量）
        _master: null,
        _noiseBuf: null,
        _ctx: function() {
            try {
                if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                if (!this._master) {
                    // 總音量 + 壓縮器，避免多個音效疊加時爆音
                    const comp = this.audioCtx.createDynamicsCompressor();
                    // 設成限幅器：音量放大後仍不會破音
                    comp.threshold.value = -3; comp.knee.value = 0; comp.ratio.value = 20;
                    comp.attack.value = 0.002; comp.release.value = 0.1;
                    this._master = this.audioCtx.createGain();
                    this._master.gain.value = this.sfxVolume;
                    this._master.connect(comp);
                    comp.connect(this.audioCtx.destination);
                }
                return this.audioCtx;
            } catch (e) { return null; }
        },
        // 單音：頻率可滑動、含起音與衰減
        _tone: function(o) {
            const c = this._ctx(); if (!c) return;
            const t0 = c.currentTime + (o.delay || 0), dur = o.dur || 0.15;
            const osc = c.createOscillator(), g = c.createGain();
            osc.type = o.type || 'sine';
            osc.frequency.setValueAtTime(o.f, t0);
            if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
            const peak = o.vol || 0.15;
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(peak, t0 + (o.attack || 0.005));
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(g); g.connect(this._master);
            osc.start(t0); osc.stop(t0 + dur + 0.02);
        },
        // 雜訊：經濾波後可做紙張摩擦、揮動聲
        _noise: function(o) {
            const c = this._ctx(); if (!c) return;
            if (!this._noiseBuf) {
                this._noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
                const d = this._noiseBuf.getChannelData(0);
                for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
            }
            const t0 = c.currentTime + (o.delay || 0), dur = o.dur || 0.2;
            const src = c.createBufferSource(); src.buffer = this._noiseBuf; src.loop = true;
            const f = c.createBiquadFilter(); f.type = o.ftype || 'bandpass';
            f.Q.value = o.q || 1;
            f.frequency.setValueAtTime(o.f, t0);
            if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t0 + dur);
            const g = c.createGain();
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t0 + (o.attack || 0.02));
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            src.connect(f); f.connect(g); g.connect(this._master);
            src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.02);
        },

        playHoverSound: function() {
            // 觸控裝置點擊時也會觸發 mouseenter，略過以免與確認音重疊
            if (window.matchMedia && window.matchMedia('(hover: none)').matches) return;
            try {
                if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
                
                // 創造一個低沉短促的「紙張輕擊/打字機」音效
                this._ctx();
                const osc = this.audioCtx.createOscillator();
                const gain = this.audioCtx.createGain();
                
                osc.type = 'triangle'; // 使用三角波，聲音比較沉
                osc.frequency.setValueAtTime(250, this.audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, this.audioCtx.currentTime + 0.05); // 快速降頻製造打擊感
                
                gain.gain.setValueAtTime(0.15, this.audioCtx.currentTime); // 音量適中
                gain.gain.exponentialRampToValueAtTime(0.01, this.audioCtx.currentTime + 0.05); // 快速收音
                
                osc.connect(gain);
                gain.connect(this._master || this.audioCtx.destination);
                
                osc.start();
                osc.stop(this.audioCtx.currentTime + 0.05);
            } catch(e) {
                console.log("Hover sound error:", e);

        }

    const cloud = (x, y, s = 1, col = '#fff') => g(x, y, ell(0, 0, 24, 9, col, 'stroke-opacity=".5"') + ell(-12, -6, 12, 9, col, 'stroke-opacity=".5"') + ell(10, -8, 14, 10, col, 'stroke-opacity=".5"'), `scale(${s})`);

    // ---------- 人物 ----------
    const arm = (x1, y1, x2, y2, col, skin) =>
        `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${INK}" stroke-width="9" stroke-linecap="round"/>` +

    const POSE = {

        if (o.star) b += star(-6, -40, 5);

    const Page1_Setup = {
        init: function() { this.renderPlayerInputs(); },
        renderPlayerInputs: function() {
            const count = document.getElementById('player-count').value;
            const container = document.getElementById('player-inputs-container');
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                container.innerHTML += `
                    <div class="player-input-group">
                        <label>玩家 ${i+1}</label>
                        <input type="text" id="p-name-${i}" placeholder="輸入名字(3字內)" maxlength="3" value="玩家${i+1}">
                    </div>
                `;
            }
        },
        submit: function() {
            const count = parseInt(document.getElementById('player-count').value);
            GameState.players = [];
            GameState.initCardPools();

            let roles = [];
            
            if (count === 1) {
                roles.push(Math.random() < 0.5 ? 'A' : 'J');
            } else {
                for (let i = 0; i < count; i++) { 
                    roles.push(i < Math.round(count / 2) ? 'A' : 'J'); 
                }
                roles = GameUtils.shuffleArray(roles);
            }

            for (let i = 0; i < count; i++) {
                const nameInput = document.getElementById(`p-name-${i}`).value.trim() || `玩家${i+1}`;
                GameState.players.push({ 
                    name: nameInput, 
                    role: roles[i], 
                    survival: START_STATS.survival, 
                    moral: START_STATS.moral, 
                    isDead: false,
                    history: [], 
                    choiceLog: [],
                    chanceCount: 0,
                    worstDecision: { cardId: null, cardText: null, choice: null, deduction: 0 } 
                });
            }
            AvatarFactory.assignAll(GameState.players);
            Page2_RoleResult.init();
        }
    };

    // ==========================================================
    // 派對稱號系統：第 3 回合結束後（第 4 回合起），依全體玩家數值與選擇紀錄即時冠上稱號
    // 純屬社交互動道具，不影響任何遊戲數值或結局
    // ==========================================================
    const TitleSystem = {
        START_ROUND: 4,
        MAX_PER_PLAYER: 2,

        quips: {
            dying:   ['全班請注意！【瀕死邊緣】的 {n} 還有救嗎？快替他想想辦法！', '【瀕死邊緣】的 {n} 看起來快撐不住了，大家要不要伸出援手？'],
            cold:    ['小心！【冷血無情】的 {n} 又要出手了，大家要不要盯緊他？', '【冷血無情】的 {n}：「別怪我，這是時代的選擇。」——全班請表態！'],
            turtle:  ['【苟且偷生】的 {n} 輪到你了，這次還想繼續躲嗎？', '大家看看【苟且偷生】的 {n}，這麼會活命，是不是有什麼祕訣？'],
            saint:   ['【道德標竿】的 {n} 登場！請全班監督：這次他還能守住嗎？', '【道德標竿】的 {n} 頭頂光環閃閃發亮，大家猜他這回會不會破功？'],
            silent:  ['【事不關己】的 {n} 這回還要當旁觀者嗎？全班喊他一聲！', '【事不關己】的 {n}，你的沉默，歷史都記得——這次要說話嗎？'],
            deserter:['【見死不救】的 {n} 這回會救人嗎？全班請盯著他的選擇。', '【見死不救】的 {n}，大家都看到你上次的選擇了，這次想怎麼做？'],
            cog:     ['【忠誠齒輪】的 {n} 要聽誰的命令？全班一起問他！', '【忠誠齒輪】的 {n} 又要乖乖服從了嗎？大家來給點壓力！'],
            rebel:   ['【星火反抗軍】的 {n} 來了！全班請鼓掌，看他這次敢不敢！', '【星火反抗軍】的 {n} 一路反抗過來，這回還撐得住嗎？'],
            hero:    ['【義無反顧】的 {n} 出場！大家猜他會不會又挺身而出？', '【義無反顧】的 {n} 又要當英雄了嗎？全班打賭看看！'],
            lucky:   ['【幸運兒】{n} 運氣爆棚，這次還能被命運眷顧嗎？', '【幸運兒】{n} 摸到好運了，大家快沾沾運氣！'],
            dead:    ['{n} 已退出這段歷史，請以旁觀者身分替下一位同學出主意。']
        },

        // 依優先順序判定每位玩家的稱號（相對排名 + 行為紀錄）
        compute: function(players) {
            const alive = players.filter(p => !p.isDead);
            const result = players.map(() => []);
            const START = START_STATS;
            const multi = alive.length >= 2;
            const sv = alive.map(p => p.survival), mv = alive.map(p => p.moral);
            const minS = Math.min.apply(null, sv), maxS = Math.max.apply(null, sv);
            const minM = Math.min.apply(null, mv), maxM = Math.max.apply(null, mv);
            const cnt = (p, pred) => (p.choiceLog || []).filter(e => e.tag !== 'chance' && pred(e)).length;

            players.forEach((p, i) => {
                const list = result[i];
                const push = (key, icon, label, cls) => list.push({ key: key, icon: icon, label: label, cls: cls });

                if (p.isDead) { push('dead', '💀', '歷史見證者', 't-dead'); return; }

                // 生存最低 → 瀕死邊緣
                if ((multi && p.survival === minS && minS < maxS && p.survival <= 5) || p.survival <= 2)
                    push('dying', '🔥', '瀕死邊緣', 't-bad');
                // 道德極低 → 冷血無情
                if ((multi && p.moral === minM && minM < maxM && p.moral <= START.moral - 2) || p.moral <= START.moral - 5)
                    push('cold', '😈', '冷血無情', 't-bad');
                // 生存最高 → 苟且偷生
                if ((multi && p.survival === maxS && minS < maxS && p.survival >= START.survival) ||
                    (!multi && p.survival >= START.survival + 2))
                    push('turtle', '🐢', '苟且偷生', 't-neutral');
                // 道德最高 → 道德標竿
                if ((multi && p.moral === maxM && minM < maxM && p.moral >= START.moral + 2) || p.moral >= START.moral + 6)
                    push('saint', '😇', '道德標竿', 't-good');
                // 行為模式稱號
                if (cnt(p, e => !e.isMoralChoice && e.category === 'indifferent') >= 2) push('silent', '🙈', '事不關己', 't-bad');
                if (cnt(p, e => e.cardMoralCat === 'rescue' && !e.isMoralChoice) >= 2) push('deserter', '🧊', '見死不救', 't-bad');
                if (cnt(p, e => !e.isMoralChoice && e.category === 'comply') >= 2) push('cog', '⚙️', '忠誠齒輪', 't-neutral');
                if (cnt(p, e => e.isMoralChoice && e.category === 'resist') >= 2) push('rebel', '🔥', '星火反抗軍', 't-good');
                if (cnt(p, e => e.isMoralChoice && e.category === 'rescue') >= 2) push('hero', '🦸', '義無反顧', 't-good');
                if ((p.chanceCount || 0) >= 1) push('lucky', '🍀', '幸運兒', 't-good');
            });

            return result.map(list => list.slice(0, this.MAX_PER_PLAYER));
        },

        isActive: function() { return GameState.currentRound >= this.START_ROUND; },

        get: function() {
            const players = GameState.players;
            if (!this.isActive()) return players.map(() => []);
            return this.compute(players);
        },

        renderPanel: function() {
            const box = document.getElementById('player-titles');
            if (!box) return;
            if (!this.isActive()) { box.className = 'player-titles'; box.innerHTML = ''; return; }
            const players = GameState.players;
            const titles = this.compute(players);
            const cur = GameState.currentPlayerIndex;

            const rows = players.map((p, i) => {
                if (!titles[i].length) return '';
                const chips = titles[i].map(t => `<span class="title-chip ${t.cls}">${t.icon} ${t.label}</span>`).join('');
                return `<div class="title-row ${(i === cur && !p.isDead) ? 'current' : ''} ${p.isDead ? 'dead' : ''}"><span class="tr-name">${p.name}</span>${chips}</div>`;
            }).join('');

            // 輪到的玩家若有稱號，給全班一句互動提示（同玩家同回合同稱號只抽一次，避免重繪時跳動）
            let prompt = '';
            const curP = players[cur];
            if (curP && !curP.isDead && titles[cur].length) {
                const pick = titles[cur].find(t => t.cls === 't-bad') || titles[cur][0];
                const arr = this.quips[pick.key] || [];
                curP._quipCache = curP._quipCache || {};
                const ck = GameState.currentRound + ':' + pick.key;
                if (!curP._quipCache[ck] && arr.length) curP._quipCache[ck] = arr[Math.floor(Math.random() * arr.length)];
                if (curP._quipCache[ck]) {
                    const line = curP._quipCache[ck].replace(/\{n\}/g, curP.name).replace(/【([^】]+)】/g, '<span class="pp-tag">【$1】</span>');
                    prompt = `<div class="party-prompt">🎉 ${line}</div>`;
                }
            }

            const sigNow = players.map((p, i) => titles[i].map(t => i + ':' + t.key));
            const flat = [].concat(...sigNow);
            const prev = this._prevSig || [];
            if (flat.some(k => !prev.includes(k))) AudioController.playTitleSound();
            this._prevSig = flat;

            box.className = 'player-titles show';
            box.innerHTML = `<div class="titles-heading">✦ 本局稱號 ✦</div><div class="titles-grid">${rows}</div>${prompt}`;
        }
    };

    const Page3_Gameplay = {
        MAX_ROUND: 10,

        init: function() {
            GameState.currentPlayerIndex = 0;
            GameState.currentRound = 1;
            this._finalBell = false;
            GameUtils.switchStep(3);
            this.loadQuestion();
        },

        // 以文字描述處境，不顯示任何數字
        statusOf: function(survival) {
            if (survival >= 6) return { text: '尚算安穩', cls: 's-safe' };
            if (survival >= 4) return { text: '令人不安', cls: 's-uneasy' };
            if (survival >= 2) return { text: '岌岌可危', cls: 's-danger' };
            return { text: '命懸一線', cls: 's-critical' };
        },

        renderRoster: function() {
            const cur = GameState.currentPlayerIndex;
            const titles = TitleSystem.get();
            document.getElementById('player-roster').innerHTML = GameState.players.map((p, i) => {
                const main = titles[i][0];
                const pin = main ? `<span class="title-pin" title="${main.label}">${main.icon}</span>` : '';
                return `
                <div class="roster-item ${p.isDead ? 'dead' : ''} ${(i === cur && !p.isDead) ? 'current' : ''}">
                    ${pin}
                    ${AvatarFactory.render(p.avatar, 44)}

        showFeedback: function(optIndex, sChange, mChange) {
            AudioController.playConfirmSound();
            const player = GameState.getCurrentPlayer();
            const card = GameState.currentCard;
            const choiceText = optIndex === 1 ? card.opt1 : card.opt2;

            player.history.push(card.id);

            let choiceTag = 'chance';
            let moralCat = null, pragCat = null, isMoralChoice = null;
            if (card.type !== 'chance') {
                const moralIdx = (card.m1 !== card.m2) ? (card.m1 > card.m2 ? 1 : 2) : (card.s1 <= card.s2 ? 1 : 2);
                choiceTag = (optIndex === moralIdx) ? 'moral' : 'practical';
                isMoralChoice = (optIndex === moralIdx);
                const tags = CARD_TAGS[card.id];
                if (tags) { moralCat = tags.moral; pragCat = tags.prag; }
            }
            player.choiceLog.push({
                cardId: card.id, tag: choiceTag, sChange: sChange, mChange: mChange,
                isMoralChoice: isMoralChoice,
                // 選到的那個選項所屬的細分類：
                //   若選了道德選項 → category 為該卡的 moral 類別（rescue／resist／brave）
                //   若選了務實選項 → category 為該卡的 prag 類別（comply／selfpreserve／indifferent）
                category: isMoralChoice === null ? null : (isMoralChoice ? moralCat : pragCat),
                cardMoralCat: moralCat
            });
            if (card.type === 'chance') { player.chanceCount = (player.chanceCount || 0) + 1; }

            if (sChange < 0 && sChange < player.worstDecision.deduction) {
                player.worstDecision = {
                    cardId: card.id,
                    cardText: card.text.replace(/\n/g, '<br>'),
                    choice: choiceText,
                    deduction: sChange
                };
            }

            document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);

            player.survival += sChange;
            player.moral += mChange;
            if (player.survival < 0) player.survival = 0;

            let feedbackText = "";
            if (optIndex === 1 && card.fb1) {
                feedbackText = card.fb1;
            } else if (optIndex === 2 && card.fb2) {
                feedbackText = card.fb2;
            } else {
                feedbackText = `你選擇了「${choiceText}」。\n在那個殘酷的年代，這項抉擇帶來了不可逆的歷史後果。`;
            }

            // 只給文字提示，不揭露任何數字（分數於結局才揭曉）
            let hintHtml;
            if (player.survival <= 0) {
                player.isDead = true;
                player.deathRound = GameState.currentRound;
                hintHtml = `<span class="fb-hint dead">💀 你的處境已無可挽回——【${player.name}】退出了這段歷史</span>`;
                this.playDeathSound();
            } else if (sChange <= -2) {
                hintHtml = '<span class="fb-hint down">⚠ 你的處境急遽惡化</span>';
                AudioController.playResultSound('heavy');
            } else if (sChange < 0) {
                hintHtml = '<span class="fb-hint down">⚠ 你的處境變得更危險了</span>';
                AudioController.playResultSound('down');
            } else if (sChange > 0) {
                hintHtml = '<span class="fb-hint up">你暫時喘了一口氣</span>';
                AudioController.playResultSound('up');
            } else {
                hintHtml = '<span class="fb-hint">局勢暫時沒有改變，但歷史不會忘記</span>';
                AudioController.playResultSound('neutral');
            }

            document.getElementById('fb-player-title').innerText = card.type === 'chance' ? `【 ${player.name} 的機會 】` : `【 ${player.name} 的抉擇 】`;
            document.getElementById('fb-text').innerHTML = GameUtils.highlightKeywords(feedbackText.replace(/\n/g, '<br>'));
            document.getElementById('fb-stats').innerHTML = hintHtml;

            const btn = document.getElementById('fb-next-btn');
            btn.innerText = player.isDead ? '確認 ➔' : '繼續下一回合 ➔';
            document.getElementById('feedback-overlay').classList.add('active');
            btn.focus({ preventScroll: true });
            this.renderRoster();
        },

        playDeathSound: function() {
            const bgMusic = document.getElementById('bg-music');
            const gameOverSound = document.getElementById('game-over-sound');
            const wasOn = !bgMusic.paused;
            bgMusic.pause();
            gameOverSound.currentTime = 0;
            // 只有一人退出時，音效結束後接回背景音樂；全員退出由結局頁接手
            gameOverSound.onended = () => {
                const stillPlaying = document.getElementById('step-3').classList.contains('active');
                if (wasOn && stillPlaying) AudioController.safePlay(bgMusic);
            };
            AudioController.safePlay(gameOverSound, null, e => console.log("無法自動播放死亡音效:", e));
        },

        nextTurn: function() {
            const overlay = document.getElementById('feedback-overlay');
            if (!overlay.classList.contains('active')) return;
            overlay.classList.remove('active');

            const players = GameState.players;
            if (players.every(p => p.isDead)) {
                this.renderRoster();
                Page4_Ending.init(true);
                return;
            }

            // 找下一位仍在遊戲中的玩家；繞回第一位時回合數 +1
            let idx = GameState.currentPlayerIndex;
            do {
                idx = (idx + 1) % players.length;
                if (idx === 0) GameState.currentRound++;
            } while (players[idx].isDead);
            GameState.currentPlayerIndex = idx;

            if (GameState.currentRound > this.MAX_ROUND) {
                Page4_Ending.init(false);
                return;
            }
            this.loadQuestion();
        }
    };

    // ==========================================================
    // 成就徽章：依玩家整局的選擇紀錄（choiceLog）與最終數值判定
    // 每張情境卡的「道德選項」＝兩個選項中 m 值較高者（平手則 s 值較低者，即犧牲較大者）
    // ==========================================================
    const Achievements = {
        // 連續三次（含以上）符合條件的最長連續次數
        streak: function(log, pred) {
            let max = 0, cur = 0;
            log.forEach(e => {
                if (e.tag !== 'chance' && pred(e)) { cur++; max = Math.max(max, cur); } else { cur = 0; }
            });
            return max;
        },
        count: function(log, pred) { return log.filter(pred).length; },

        defs: [
            // ---- 連續抉擇模式：三種「選擇務實／放棄道德選項」、兩種「選擇道德選項」----
            {
                icon: '🙈', name: '沉默的共犯',
                desc: '連續三次選擇「事不關己」，對眼前的不義視而不見。',
                test: function(p, log, all) {
                    return Achievements.streak(log, e => !e.isMoralChoice && e.category === 'indifferent') >= 3;
                }
            },
            {
                icon: '🦸', name: 'Superman 拯救者',
                desc: '連續三次甘冒風險，挺身救人。',
                test: function(p, log, all) {
                    return Achievements.streak(log, e => e.isMoralChoice && e.category === 'rescue') >= 3;
                }
            },
            {
                icon: '🧊', name: '完美求生但缺少人性的存活者',
                desc: '連續三次放棄了拯救他人的機會，選擇明哲保身。',
                test: function(p, log, all) {
                    return Achievements.streak(log, e => e.cardMoralCat === 'rescue' && !e.isMoralChoice) >= 3;
                }
            },
            {
                icon: '⚙️', name: '忠誠的齒輪',
                desc: '連續三次選擇配合、服從上級命令或政府政策。',
                test: function(p, log, all) {
                    return Achievements.streak(log, e => !e.isMoralChoice && e.category === 'comply') >= 3;
                }
            },
            {
                icon: '🔥', name: '星火燎原',
                desc: '連續三次選擇反抗、抵抗或違抗命令。',
                test: function(p, log, all) {
                    return Achievements.streak(log, e => e.isMoralChoice && e.category === 'resist') >= 3;
                }
            },
            {
                icon: '🛡️', name: '明哲保身',
                desc: '連續三次把自保放在他人之前。',
                test: function(p, log, all) {
                    return Achievements.streak(log, e => !e.isMoralChoice && e.category === 'selfpreserve') >= 3;
                }
            },
            // ---- 結局與數值相關：結算時才看得出來 ----
            {
                icon: '🕊️', name: '國際義人之路',
                desc: '最終存活，且道德指數是全場最高。',
                test: function(p, log, all) {
                    const maxMoral = Math.max.apply(null, all.map(function(x) { return x.moral; }));
                    return !p.isDead && p.moral === maxMoral;
                }
            },
            {
                icon: '⚰️', name: '殉道者',
                desc: '最終雖未能倖存，道德指數卻是全場最高——死得其所。',
                test: function(p, log, all) {
                    const maxMoral = Math.max.apply(null, all.map(function(x) { return x.moral; }));
                    return p.isDead && p.moral === maxMoral;
                }
            },
            {
                icon: '⚖️', name: '掙扎的靈魂',
                desc: '生存與道德都沒有走向極端，勉強撐過這段歷史——這是當年多數人的樣子。',
                test: function(p, log, all) {
                    if (p.isDead) return false;
                    const key = Page4_Ending.getEndingKey(p);
                    return key === 'midHi' || key === 'midLo';
                }
            },
            {
                icon: '🍀', name: '幸運的眷顧',
                desc: '身為猶太人，兩度遇上歷史裡真實存在的義人，獲得逃生的機會。',
                test: function(p, log, all) {
                    return p.role === 'J' && (p.chanceCount || 0) >= 2;
                }
            }
        ],

        compute: function(p, allPlayers) {
            const log = p.choiceLog || [];
            const all = allPlayers || [p];
            return this.defs.filter(function(d) { return d.test(p, log, all); });
        }
    };
