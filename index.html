        // ==========================================================
        // 結局門檻（經數十萬場模擬校準，可用 simulate_balance.js 重跑驗證）
        // 卡片設計上「生存」與「道德」互為取捨，兩者高度負相關，
        // 因此「道德高低」不能用單一固定值，而是在各生存層級內各自切分：
        //   dead  ：生存歸零。道德 ≥ deadMoral → 義人殉難，否則 → 共謀者的下場
        //   mid   ：生存 ≤ midMax 的倖存者。道德 ≥ midMoral 為「高」
        //   high  ：生存 >  midMax 的倖存者。道德 ≥ highMoral 為「高」
        // ==========================================================
        ENDING_RULES: {
            A: { midMax: 7, deadMoral: 16, midMoral: 12, highMoral: 4 },
            J: { midMax: 8, deadMoral: 17, midMoral: 13, highMoral: 6 }
        },

        ENDING_POOLS: {
            A: {
                deadHi: ['G51', 'G52', 'G57'], deadLo: ['G53', 'G54'],
                midHi:  ['G56', 'G64'],        midLo:  ['G55', 'G58', 'G59', 'G60', 'G61'],
                highHi: ['G62', 'G63', 'G65'], highLo: ['G66', 'G67', 'G68']
            },
            J: {
                deadHi: ['J51'],               deadLo: ['J52'],
                midHi:  ['J53', 'J59'],         midLo:  ['J54', 'J55'],
                highHi: ['J56', 'J57', 'J58', 'J59'], highLo: ['J60', 'J61', 'J62']
            }
        },

        getEndingKey: function(p) {
            const r = this.ENDING_RULES[p.role];
            if (p.survival <= 0) return p.moral >= r.deadMoral ? 'deadHi' : 'deadLo';
            if (p.survival <= r.midMax) return p.moral >= r.midMoral ? 'midHi' : 'midLo';
            return p.moral >= r.highMoral ? 'highHi' : 'highLo';
        },

        getEndingPool: function(p) {
            return this.ENDING_POOLS[p.role][this.getEndingKey(p)];
        },

        renderFinalResults: function(container) {
            const usedEndings = new Set();
            GameState.players.forEach(p => {
                const possibleEndingIds = this.getEndingPool(p);

                let availableEndings = possibleEndingIds.filter(id => !usedEndings.has(id));
                if (availableEndings.length === 0) availableEndings = possibleEndingIds;
                const randId = availableEndings[Math.floor(Math.random() * availableEndings.length)];
                usedEndings.add(randId); 

                const chosenEnding = endingsDB[randId];
                const endParas = chosenEnding.paras || [chosenEnding.desc];
                let endingBodyHtml = endParas.map(t => `<p>${GameUtils.highlightKeywords(t)}</p>`).join('');
                if (chosenEnding.url) {
                    endingBodyHtml += `<p class="ending-link">🔗 延伸閱讀：<a href="${chosenEnding.url}" target="_blank" rel="noopener noreferrer">${chosenEnding.url}</a></p>`;
                }
                const statusText = p.survival === 0 ? `<span style="color: var(--accent-red); font-weight: 900;">[第 ${p.deathRound} 回合退出]</span>` : '<span style="color: var(--accent-green); font-weight: 900;">[存活]</span>';

                let worstDecisionHtml = '';
                if (p.worstDecision.deduction < 0) {
                    worstDecisionHtml = `
                        <div class="worst-decision">
                            <div class="worst-title">⚠️ 最重大抉擇 (生存指數 ${p.worstDecision.deduction})：</div>
                            <div class="worst-content">
                                <strong>【${p.worstDecision.cardId}】</strong><br>
                                ${GameUtils.highlightKeywords(p.worstDecision.cardText)}<br><br>
                                <strong style="color: var(--accent-red);">您的選擇：${GameUtils.highlightKeywords(p.worstDecision.choice)}</strong>
                            </div>
                        </div>
                    `;
                } else {
                    worstDecisionHtml = `
                        <div class="worst-decision">
                            <div class="worst-title" style="color: var(--accent-green);">🌟 完美求生：未曾因任何抉擇扣除生存指數！</div>
                        </div>
                    `;
                }

                let historyHtml = `
                    <div class="history-section">
                        <div class="history-title">🎞️ 人生跑馬燈</div>
                        <div class="history-cards">經歷情境：${p.history.length > 0 ? p.history.join(' ➔ ') : '無'}</div>
                        ${worstDecisionHtml}
                    </div>
                `;

                const badges = Achievements.compute(p, GameState.players);
                const badgesHtml = badges.length > 0 ? `
                    <div class="badge-section">
                        <div class="badge-title">🎖️ 本局成就徽章</div>
                        <div class="badge-list">
                            ${badges.map(b => `
                                <div class="badge-chip">
                                    <span class="badge-icon">${b.icon}</span>
                                    <span class="badge-text"><strong>${b.name}</strong><br>${b.desc}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                ` : '';

                container.innerHTML += `
                    <div class="ending-card">
                        <div class="ending-avatar ${p.survival === 0 ? 'dead' : ''}">${AvatarFactory.render(p.avatar, 110)}</div>
                        <h3>【${p.name}】最終結算 ${statusText}</h3>
                        <table class="score-board">
                            <tr><th>身分</th><th>最終生存指數</th><th>最終道德指數</th></tr>
                            <tr><td>${p.role === 'A' ? '雅利安人' : '猶太人'}</td><td>${p.survival}</td><td>${p.moral}</td></tr>
                        </table>
                        ${badgesHtml}
                        <h4>${GameUtils.highlightKeywords(chosenEnding.title)}</h4>
                        ${endingBodyHtml}
                        ${historyHtml}
                    </div>
                `;
            });
        }
    };

    // ==========================================
    // 4. 初始化啟動
    // ==========================================
    // 各項初始化彼此獨立：音效若在某些手機瀏覽器失敗，也不會影響遊戲開始
    try { AudioController.init(); } catch (e) { console.log('音效初始化失敗：', e); }
    Page1_Setup.init();

</script>
</body>
</html>
