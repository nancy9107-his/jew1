<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1940 ：誰能活下去？</title>
    <!-- 引入 Noto Serif TC (支援 400 一般與 900 Black 粗細) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 寫實簡約羊皮紙色系 */
            --parchment-bg: #f4ecd8;
            --parchment-dark: #e8dbbf;
            --text-main: #2b221e;
            --text-muted: #5c4a42;
            --border-color: #7b6243;
            --accent-red: #8b0000;
            --accent-blue: #1c3b57;
            --accent-green: #2b6938; /* 用於增加分數時的提示色 */
            --card-bg: #fbf8f1;
        }

        body {
            background-color: #1a1614;
            background-image: radial-gradient(circle, #2a2421 0%, #110f0e 100%);
            color: var(--text-main);
            font-family: "Noto Serif TC", "Songti TC", "STSong", serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-size: 1.2rem;
        }

        .container {
            width: 95%;
            max-width: 1000px;
            background-color: var(--parchment-bg);
            background-image: radial-gradient(circle at center, #fdfbf7 0%, var(--parchment-bg) 100%);
            border: 6px double var(--border-color);
            box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 0 80px rgba(123, 98, 67, 0.15);
            padding: 50px;
            box-sizing: border-box;
            position: relative;
        }

        h1, h2, h3 {
            text-align: center;
            color: var(--text-main);
            letter-spacing: 2px;
        }

        /* 標題設定為 NotoSerifBlack (font-weight: 900) */
        h1 {
            font-family: "Noto Serif TC", serif;
            font-weight: 900; 
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 25px;
            margin-top: 0;
            font-size: 3.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h2 {
            font-weight: 900;
            font-size: 2.2rem;
            margin-bottom: 25px;
        }

        p {
            font-size: 1.5rem;
            line-height: 1.8;
        }

        .step-section {
            display: none;
        }

        .step-section.active {
            display: block;
            animation: fadeIn 0.6s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn {
            background-color: var(--parchment-dark);
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 16px 35px;
            font-size: 1.6rem;
            font-family: inherit;
            font-weight: 900;
            cursor: pointer;
            display: block;
            margin: 40px auto 0;
            transition: all 0.2s ease;
            box-shadow: 3px 3px 6px rgba(0,0,0,0.1);
        }

        .btn:hover {
            background-color: var(--text-main);
            color: var(--parchment-bg);
            border-color: var(--text-main);
            transform: translateY(-2px);
            box-shadow: 4px 6px 12px rgba(0,0,0,0.2);
        }

        .player-input-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            align-items: center;
            justify-content: center;
        }

        .player-input-group label {
            font-weight: 900;
            font-size: 1.6rem;
            width: 120px;
            text-align: right;
        }

        .player-input-group input {
            padding: 12px;
            font-size: 1.5rem;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            font-family: inherit;
            width: 220px;
        }

        select {
            padding: 10px 20px;
            font-size: 1.5rem;
            font-family: inherit;
            border: 2px solid var(--border-color);
            background: var(--card-bg);
            cursor: pointer;
        }

        .game-status-bar {
            display: flex;
            justify-content: space-around;
            background: transparent;
            border-bottom: 3px double var(--border-color);
            padding-bottom: 20px;
            margin-bottom: 30px;
            font-weight: 900;
            font-size: 1.6rem;
        }

        .card-container {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            padding: 40px;
            min-height: 300px;
            box-shadow: 4px 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
        }

        .card-content {
            font-size: 2rem;
            line-height: 1.8;
            margin-bottom: 40px;
            white-space: pre-line;
            color: var(--text-main);
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option-btn {
            background: var(--parchment-bg);
            border: 2px solid var(--border-color);
            padding: 20px 25px;
            text-align: left;
            font-size: 1.6rem;
            font-family: inherit;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: var(--parchment-dark);
            border-color: var(--text-main);
            transform: translateX(5px);
        }
        
        .option-btn:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .ending-card {
            background: var(--card-bg);
            border: 4px double var(--border-color);
            padding: 40px;
            margin-top: 30px;
        }

        .ending-card h3 {
            font-size: 2rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .ending-card h4 {
            font-size: 1.8rem;
            color: var(--text-main);
            margin-bottom: 15px;
        }

        .ending-card a {
            color: var(--accent-blue);
            font-weight: 900;
            text-decoration: underline;
        }

        .score-board {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            margin-bottom: 30px;
            font-size: 1.5rem;
        }

        .score-board th, .score-board td {
            border: 2px solid var(--border-color);
            padding: 15px;
            text-align: center;
        }

        .score-board th {
            background-color: var(--parchment-dark);
        }
        
        .survival-score-text {
            color: var(--accent-red);
            display: inline-block;
        }

        .moral-score-text {
            color: var(--accent-blue);
            display: inline-block;
        }

        /* 彈跳動畫 (用於指數增加時) */
        @keyframes scoreBounce {
            0% { transform: scale(1); }
            30% { transform: scale(1.8) translateY(-3px); color: var(--accent-green); text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
            100% { transform: scale(1); }
        }
        
        .bounce-anim {
            animation: scoreBounce 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        #music-toggle-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            color: var(--text-muted);
            border-radius: 4px;
            z-index: 10;
        }
        
        #music-toggle-btn:hover {
            background-color: var(--border-color);
            color: var(--parchment-bg);
        }
        
        .death-banner {
            background-color: var(--text-main);
            color: var(--parchment-bg);
            padding: 25px;
            text-align: center;
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 35px;
            border: 3px double var(--parchment-bg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: shake 0.6s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }

        /* 支援「減少動態效果 (Prefers Reduced Motion)」 */
        @media (prefers-reduced-motion: reduce) {
            .step-section.active {
                animation: none !important;
            }
            .bounce-anim {
                animation: none !important;
                /* 若關閉動畫，改為直接改變文字顏色示意即可 */
                color: var(--accent-green); 
                transition: color 0.7s;
            }
            .death-banner {
                animation: none !important;
            }
            .option-btn:hover:not(:disabled) {
                transform: none;
            }
        }
    </style>
</head>
<body>

<audio id="bg-music" src="1 開場懸疑.mp3" loop preload="auto"></audio>
<audio id="ending-music" src="溫暖的留白.mp3" loop preload="auto"></audio>
<audio id="game-over-sound" src="結束音效.m4a" preload="auto"></audio>

<div class="container">
    <button id="music-toggle-btn" onclick="AudioController.toggleMusic()">開啟音樂</button>

    <h1>1940 ：誰能活下去？</h1>

    <!-- 階段一 -->
    <div id="step-1" class="step-section active">
        <h2>步驟一：設定玩家人數與姓名</h2>
        <p style="text-align: center; color: var(--text-muted);">請選擇遊戲人數（1至6人），並輸入玩家姓名（限三個字內）。<br>系統將自動平均分配身分。</p>
        
        <div style="text-align: center; margin: 40px 0;">
            <label for="player-count" style="font-size: 1.6rem; font-weight: 900;">遊戲人數 (1-6)：</label>
            <select id="player-count" onchange="Page1_Setup.renderPlayerInputs()">
                <option value="1">1 人</option>
                <option value="2">2 人</option>
                <option value="3">3 人</option>
                <option value="4" selected>4 人</option>
                <option value="5">5 人</option>
                <option value="6">6 人</option>
            </select>
        </div>

        <div id="player-inputs-container"></div>
        <button class="btn" onclick="Page1_Setup.submit()">確認並抽籤身分</button>
    </div>

    <!-- 階段二 -->
    <div id="step-2" class="step-section">
        <h2>步驟二：身分抽籤結果</h2>
        <p style="text-align: center; color: var(--text-muted);">歷史的命運已為各位指派了時代身分：</p>
        
        <div id="identity-results" style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin: 40px 0;"></div>
        <button class="btn" onclick="Page2_RoleResult.startGame()">開始情境抉擇</button>
    </div>

    <!-- 階段三 -->
    <div id="step-3" class="step-section">
        <div class="game-status-bar">
            <span id="current-player-turn">玩家：</span>
            <span id="current-player-role">身分：</span>
            <span>生存：<span id="current-survival-score" class="survival-score-text">10</span></span>
            <span>道德：<span id="current-moral-score" class="moral-score-text">10</span></span>
            <span id="current-round-info">回合：1</span>
        </div>

        <div class="card-container">
            <div class="card-content" id="card-text-display">情境內容載入中...</div>
            <div class="options-group" id="card-options-display"></div>
        </div>
    </div>

    <!-- 階段四 -->
    <div id="step-4" class="step-section">
        <h2>歷史審判與結局</h2>
        <p style="text-align: center; color: var(--text-muted);">歷史的洪流無情吞噬，以下是最終統計與結局：</p>
        
        <div id="final-results-container"></div>
        <button class="btn" onclick="location.reload()">重新開始遊戲</button>
    </div>
</div>

<script>
    // ==========================================
    // 1. 卡牌與劇本資料庫
    // ==========================================
    const gCards = [
        { id: "G01", text: "G01\n凡穆勒醫生認為精神病患者和殘疾兒童是「浪費糧食的人」、「無用之人只是國家負擔」，將其安樂死是正當的行為。\n你是否會將劇毒調換為無害藥劑，並協助病童逃離醫院？", opt1: "是，我會暗中替換藥劑", opt2: "否，我會執行安樂死亡", s1: -1, m1: 2, s2: 1, m2: -2 },
        { id: "G02", text: "G02\n戈林將軍在一戰時創下擊落22架敵機的紀錄，因此被希特勒任命為德國空軍總司令。但是，完善空軍設備的經費卻是他強搶猶太人的財產而來。\n若你是戈林，是否會用猶太人財產來完備德國空軍？", opt1: "是，強大德國實力最重要", opt2: "否，侵吞他人財產不道德", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "G03", text: "G03\n「萊茵哈德行動」負責處理猶太人的財產。官員透過柏林的當舖、瑞士的珠寶市場來出售這些財物。\n然而，巨額財富也引發盜竊、貪腐等行為。\n若你沒收了大量猶太人的財物，你會如何處置？", opt1: "是，直接上繳充實國庫", opt2: "否，私藏珍貴物品變賣", s1: 1, m1: -1, s2: -1, m2: -2 },
        { id: "G04", text: "G04\n普呂福在日記強烈批評屠殺猶太人的相關政策。但很可惜，普呂福日記的內容是在1946年(二戰結束後)加上去，就是刻意留下紀錄給將來的人閱讀。\n若你有書寫日記的習慣，你是否會像普呂福這樣做？", opt1: "是，我會刪除歧視的言論", opt2: "否，我不會竄改過往言論", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "G05", text: "G05\n1940年維也納科學會議裡，專家決議：「將難搞兒童集中監管並預防性拘留。」但不少醫生反對，認為鼓勵、建立信任才能促進心理健康。\n若你是與會的精神科醫生，你會堅持自己的研究嗎？", opt1: "是，即便高層會派人關切", opt2: "否，接受專家決議求升遷", s1: -1, m1: 2, s2: 1, m2: -2 },
        { id: "G06", text: "G06\n博斯成立小成衣廠，1930年因經濟不景氣，工廠面臨破產。於是，他決定為納粹軍方設計制服，替工廠帶來豐厚利潤。至1941年，成衣廠盈利增長80倍。\n若你是博斯，你願意成為納粹軍服的供應商嗎？", opt1: "是，能挽救破產危機", opt2: "否，不想與納粹掛勾", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "G07", text: "G07\n醫生培育病毒，然後注射到犯人身上觀察效果，並沒有採取任何措施來減少疼痛。在實驗室裡，許多人蜷縮在角落，恐懼尖叫。\n執行實驗時，你是否願意為猶太人注射麻藥以減輕他們的痛苦？", opt1: "是，我會協助注射麻藥", opt2: "否，他人痛苦與我無關", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "G08", text: "G08\n全國報社派出記者，每天都聚集在「宣傳部」接受納粹政權的指示。隨著希特勒地位持續上升，反納粹記者都遭驅離。野蠻指責猶太人的內容出現在所有的報紙之中。\n身為記者，你是否會配合納粹對猶太人醜化攻擊？", opt1: "是，加入譴責與醜化行列", opt2: "否，就事論事、眼見為憑", s1: 1, m1: -2, s2: -1, m2: 2 },
        { id: "G09", text: "G09\n「生命源泉計畫」勸說年輕、種族純淨的女人和黨衛軍官結合，以產下純種亞利安後代，甚至鼓勵軍官與多名女人保持性關係。1936年上千名愛國少女未婚懷孕。在政府推動下，無需結婚且孩子是合法的。\n你是否願意出於愛國心，與黨衛軍官未婚懷孕？", opt1: "是，我願意加入集體配婚", opt2: "否，我不願因此犧牲真愛", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "G10", text: "G10\n德國學校老師都須加入教師聯盟，宣誓效忠希特勒。「種族科學」課程被引入教學，並展示亞利安人特徵的圖像，藉此讓學生鄙視猶太人，而神化希特勒。\n身為納粹德國的老師，是否願意在課堂裡對猶太學生釋出善意？", opt1: "是，我願意提供善意環境", opt2: "否，我不願意多付出關注", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "G11", text: "G11\n1940年代，德國勞改場收押大量妓女、小偷、流浪漢、酒鬼等，並請鑑定專家判定價值。專家們宣稱「沒有生存價值」，一致同意將這些人處死。\n若你有認識「符合勞改犯定義」的親屬朋友，你是否會配合政策向警察舉報？", opt1: "是，淨化血統人人有責", opt2: "否，維護家人朋友安危", s1: 1, m1: -2, s2: -1, m2: 2 },
        { id: "G12", text: "G12\n女記者費德利希建立反抗組織，來照顧許多身處危險的猶太人。他們還從事破壞工廠、毀損納粹象徵、向國外報導集中營真實情況等激進行為。\n若你意外得知了這個組織的存在，你會怎麼做呢？", opt1: "是，加入組織並提供協助", opt2: "否，向蓋世太保告密，領取賞金", s1: -1, m1: 2, s2: 1, m2: -2 },
        { id: "G13", text: "G13\n儘管納粹政權秘密進行處置猶太人的最終方案，然而消息卻四處流傳。你聽聞有人參與射殺3000名猶太人行動，而且逼迫猶太人挖掘足球場大小的墳墓。\n若你聽聞不合理的大規模猶太屠殺事件，你是否會將事件上報高層？", opt1: "是，我願意舉發濫殺行為", opt2: "否，他人之行為與我無關", s1: 0, m1: 1, s2: 0, m2: -1 },
        { id: "G14", text: "G14\n當時社會日漸流行安樂死的觀點，特別是不少父母願意讓孩子得到解脫。同時為了減輕父母親良心負擔，醫生必須承擔解決問題兒童的責任。\n若你的後代是身心障礙病童，且從未聽聞治癒案例，你仍會配合政策，將孩子送入國家經營療養院？", opt1: "是，我會送走孩子", opt2: "否，我會自行撫養", s1: 0, m1: -1, s2: 0, m2: 1 },
        { id: "G15", text: "G15\n隆美爾將軍在二戰時建立彪炳戰功，曾俘虜「自由法國第一旅」，這是由眾多猶太人所組成的部隊。希特勒因此向隆美爾下令，將其成員處決。\n如果你是隆美爾，是否會遵照希特勒指示，處決這些人呢？", opt1: "是，忠誠地執行處決命令", opt2: "否，不忍心執行處決命令", s1: 1, m1: -2, s2: -1, m2: 2 },
        { id: "G16", text: "G16\n約翰的猶太員工顫抖說著自己收到了「產物清單」，這代表即將被送到集中營。約翰為保全員工性命，向蓋世太保爭取:「你們把員工都帶走了，我該怎麼執行國防部的訂單呢？」\n如果是你，你是否願意向蓋世太保爭取留下員工？", opt1: "是，因為生命可貴", opt2: "否，各人有其命運", s1: -1, m1: 2, s2: 1, m2: -2 },
        { id: "G17", text: "G17\n約書亞是看守奧斯維茲集中營的士兵。某天離開營區時，被一位老人攔住，表示願意以金錢為代價，請求他幫忙將信件、衣服轉交給另一猶太工人，並為他攜帶回信。\n你是否會願意冒著被人發現，甚至被射殺的風險提供協助？", opt1: "是，助人又可獲得金錢", opt2: "否，自己的生命更重要", s1: -2, m1: 2, s2: 2, m2: -2 },
        { id: "G18", text: "G18\n保時捷是德國頂尖汽車生產公司。二戰時納粹政府要求協助設計坦克車，並將汽車工廠轉型成武器工廠，還提供猶太人作為廉價勞力。\n如果你是保時捷老闆，你會接受政府的提議嗎？", opt1: "是，趁戰爭賺取大筆財富", opt2: "否，不打算取得不義之財", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "G19", text: "G19\n卡蘿拉是德國12歲中學生，「種族學」課程教導了猶太人是劣等人種。還曾目睹猶太人不需要任何原因，就被綁在椅上受皮鞭責打。\n如果你是卡蘿拉，看到這種場景，會有甚麼反應？", opt1: "是，他們本就是低賤人種，處罰是應得的", opt2: "否，找同學討論並質疑這行為的合理性", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "G20", text: "G20\n艾希曼將匈牙利44萬名猶太孩童、婦女送進毒氣室。眾多納粹官員為了搶功而想要擔任先鋒，積極去爭取這項「血腥」的任務。\n如果你是納粹官員，你是否會去爭取這個任務？", opt1: "是，我不能改變任務，搶先立功可以過更好生活", opt2: "否，我雖無力阻止，但協助大屠殺是不道德行為", s1: 1, m1: -1, s2: 0, m2: 1 },
        { id: "G21", text: "G21\n埃里希曾是德國海軍元帥因與希特勒發生戰術上的爭執，被解除元帥職位。隨著戰況惡化，一群軍官計畫推翻希特勒，於是邀請埃里希加入。\n如果你是埃里希，你會選擇加入推翻計畫嗎？", opt1: "是，與元首關係已到低點，未來也可能性命不保", opt2: "否，即使與元首不合，也要保持對國家的忠誠", s1: -2, m1: 0, s2: 2, m2: 0 },
        { id: "G22", text: "G22\n里芬斯塔爾是女性電影導演，作品深受希特勒喜愛。但金援拍片的條件是必須為希特勒拍攝形象影片，宣傳他與日耳曼民族的偉大，以及猶太人的邪惡。\n如果你是里芬斯塔爾，你會接受元首的條件嗎？", opt1: "是，想要有成就，元首金援支持是必要的", opt2: "否，政治歸政治，藝術不應沾染政治色彩", s1: 0, m1: -1, s2: 0, m2: 1 },
        { id: "G23", text: "G23\n為了毫無顧忌地實施「解決方案」，必須先修改法律規範讓猶太人失去參政權、工作權、財產權甚至國籍。\n如果你是一位法學專家，你是否會無視自身法學素養，配合政府制定法案？", opt1: "是，我不做也會有別人做", opt2: "否，這違背我的職業道德", s1: 1, m1: -2, s2: -1, m2: 2 },
        { id: "G24", text: "G24\n倪慕樂牧師反抗納粹干涉教會與信仰的自由，因此他先被禁止發表言論，之後被捕。刑期屆滿卻未被釋放，在集中營滯留，直至戰爭結束。\n如果是你，願意為宗教信仰自由反抗政府當局嗎？", opt1: "是，一切應歸於耶穌基督", opt2: "否，上帝會明白我的困境", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "G25", text: "G25\n1943年納粹開始逮捕德國女人的猶太裔丈夫。她們聚集於玫瑰街猶太人安置所門前，要求釋放她們的丈夫。軍人威脅開槍，但她們毫不退讓，持續抗議。\n如果你的猶太丈夫突然被監禁，你會進行抗議嗎？", opt1: "是，走上玫瑰街抗議，自己的男人自己救", opt2: "否，認同政策，接受命運", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "G26", text: "G26\n施丁騰堡伯爵是德國外交官，家世顯赫。他厭惡納粹，拒絕擔任政府公職。運用自己的影響力協助猶太學生申請獎學金留學英國，幫助猶太人移民國外。\n如果你是納粹時期的外交官，當當你發現伯爵的作為，是否願意冒著風險協助他？", opt1: "是，會竭盡所能去幫助他", opt2: "否，不願意犧牲官場前程", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "G27", text: "G27\n1944年史陶芬保上校曾企圖引爆炸彈炸死希特勒，但未成功，導致「華爾奇麗雅行動」未能啟動，使政變走向失敗。\n若你身為納粹軍官將領，你是否會參與720 密謀案？", opt1: "是，為國家著想，無法認同希特勒理念", opt2: "否，保有個人地位才算是最重要的事情", s1: -2, m1: 0, s2: 2, m2: 0 },
        { id: "G28", text: "G28\n白玫瑰運動是由慕尼黑醫學院大學生組成，他們透過發送傳單，呼籲人們反抗希特勒。不久後，成員都被處死。然而傳單被大量印刷祕密送出德國，透過同盟國飛機散布各地。\n若你拾獲傳單，你是否願意將它傳遞出去？", opt1: "是，我願意傳遞學生理念", opt2: "否，我不願意冒生命風險", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "G29", text: "G29\n德國相機品牌「萊卡」主席萊茲二世，二戰時雇用大量猶太人，並以派任海外為由將猶太人送離德國，被稱為「萊卡自由列車」。數百人因他而被拯救。\n若你是萊茲二世，會進行「自由列車行動」嗎？", opt1: "是，竭盡所能幫助猶太人", opt2: "否，為保有萊卡品牌而與納粹保持良好關係", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "G30", text: "G30\n木匠艾爾塞對納粹作為反感，決心刺殺希特勒。他利用希特勒每年會到慕尼黑啤酒館發表演說的機會，預先裝設炸彈。但因希特勒提前離開，而未能成功。\n如果你是艾爾塞，你是否仍會執行暗殺行動？", opt1: "是，炸死希特勒才能拯救德國", opt2: "否，小人物無法對抗強權", s1: -2, m1: 1, s2: 2, m2: -1 },
        { id: "G31", text: "G31\n納粹推行「總體戰」動員令，要求國內所有非必要產業暫停營業，所有成年勞動力必須投入軍火生產工廠。\n身為工廠負責人，你是否願意配合將藝術文具廠強制改裝為彈藥裝配廠？", opt1: "是，全力支援前線作戰", opt2: "否，保護傳統工藝與員工", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "G32", text: "G32\n蓋世太保要求鄰里互相檢舉「耳語者」，任何散布前線戰敗謠言或批評元首的人將以叛國罪處決。\n你無意間聽到鄰居私下抱怨戰爭永無止境，你是否會向當局舉報？", opt1: "是，維護國家忠誠與法紀", opt2: "否，鄰居場景與我無關", s1: 1, m1: -2, s2: -1, m2: 1 },
        { id: "G33", text: "G33\n前線德國士兵在寒冬中缺乏防寒裝備，柏林發起「冬季救濟金」強制募捐，要求每戶交出多餘的呢絨大衣與毛毯。\n你是否願意將家中僅存的保暖衣物全部捐出？", opt1: "是，前方士兵更需要保暖", opt2: "否，留著自家過冬保命", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "G34", text: "G34\n納粹青年團強制吸收10歲以上少年接受準軍事訓練與極端種族思想洗腦。你的孩子即將屆齡入團。\n身為家長，你是否會試圖讓孩子逃避強制入團？", opt1: "是，暗中尋管道讓孩子退出", opt2: "否，讓孩子接受組織洗禮", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "G35", text: "G35\n戰局急轉直下，盟軍已經逼近德黑蘭與柏林外圍，高層下令燒毀所有涉及種族清洗與行政迫害的祕密檔案。\n身為檔案管理員，你是否會選擇私藏部分檔案作為歷史見證？", opt1: "是，冒險留下歷史真相", opt2: "否，遵照命令全部焚毀", s1: -2, m1: 2, s2: 1, m2: -2 }
    ];

    const jCards = [
        { id: "J01", text: "J01\n有位猶太人回憶，為求盡快逃出危險的猶太隔離區以躲過死劫。於是考慮洗劫「猶太委員會」錢箱，讓自己能在短時間內弄到足夠的金錢。\n你是否會為了逃離隔離區而搶劫與納粹政權親近的「猶太委員會」？", opt1: "是，我願意為生存去冒險", opt2: "否，我不願搶劫導致別人的損失", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "J02", text: "J02\n學醫的猶太人回憶：「曾經在納粹的要求下，切下健康女孩的肉，把侏儒、殘疾人的身體用化學溶液保存。目的是放入帝國博物館，讓後代理解滅絕猶太人的行為是正當的。」\n若你擁有醫學背景被聘為集中營醫生，你是否願意執行解剖活體的任務？", opt1: "是，為了生存願意執行", opt2: "否，拒絕任務，無法接受殘忍對待同胞", s1: 1, m1: -2, s2: -1, m2: 2 },
        { id: "J03", text: "J03\n猶太人遭受歧視的氛圍下，最慘的是猶太小孩。亞利安小孩會毆打他們，有些猶太人為了救小孩，不顧危險幫忙解圍，好讓猶太小孩有機會逃脫。\n如果你見到猶太小孩被毆打，是否願意伸出援手解救他們？", opt1: "是，願意對小孩伸出援手", opt2: "否，擔心受牽連不願介入", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "J04", text: "J04\n地鐵、街上，會有不認識的人靠近猶太人，放些東西到大衣口袋，像是蘋果、肉等，大多是猶太人不能取得的物資。\n在猶太人被限制物資來源的情況下，你是否會將無法公開取得的物資分享給猶太人？", opt1: "是，願意提供猶太人物資", opt2: "否，物資有限，無法分享", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "J05", text: "J05\n1939年大學、科學機構，被要求解雇猶太人。同時猶太人亦被禁止出入公共場所、參加體育比賽、擁有汽車牌照、電話和收音機。\n你若是被解雇的一員，是否會挺身抗議不平等法律？", opt1: "是，我願意挺身抗議不公", opt2: "否，我不願意冒生命危險", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "J06", text: "J06\n克羅赫瑪是比利時猶太人，1943年他與1900人一起被移送到奧斯威辛集中營的路上。途中有3名年輕人阻止了死亡列車前進，拯救231條人命。\n如果你也在現場，是否願意和年輕人們一起阻止死亡列車的前進呢？", opt1: "是，拯救人命是最重要的", opt2: "否，我害怕遭到納粹報復", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "J07", text: "J07\n葛柏是奧斯威辛集中營猶太人囚工，負責把猶太人屍體從毒氣室拉出來，再塞進焚屍爐火化。在黨衛軍的監視下，他必須取出受害者的值錢物品和金牙，然後再把屍體塞進焚燒爐。\n如果你是葛柏，是否願意擔任這項工作？", opt1: "是，不計一切為求生存", opt2: "否，我不願當納粹幫凶", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "J08", text: "J08\n鄰居門口站著兩位高大納粹，他們問：「霍恩斯坦太太是不是住在這裡？」結果她就被帶走了。我思考著是否應該通知她的女兒？但猶太人無法使用電話、夜晚又被禁止外出。\n若是你，是否會冒著被納粹捕捉的風險，去告知霍恩斯坦太太的家人？", opt1: "是，願意冒險通知其家人", opt2: "否，無法接受被捕的風險", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "J09", text: "J09\n「水晶之夜」使柏林成為人間煉獄，衝鋒隊在深夜以斧頭、長刀敲碎猶太商店的櫥窗玻璃。一對猶太夫婦木然看著，卻有人喊：「猶太人滾！」太太回嗆：「你這該死的豬！」先生面色白皙：「天啊~別再說了！」\n如果是你，你會如何面對這場災難與羞辱？", opt1: "是，出面指責亞利安人", opt2: "否，選擇閉嘴息事寧人", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "J10", text: "J10\n長居英國的猶太人只能收容一位家族成員，並需繳交高額保證金。最終，父親決定獨自飛往英國接受庇護，留下女兒與太太在混亂的德國。\n若是你擁有逃往英國機會，是否會選擇拋下家人獨自前去英國接受庇護？", opt1: "是，能前往英國機會難得", opt2: "否，會選擇放棄逃亡機會，家人團聚一起比較安心", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "J11", text: "J11\n凱明斯基擁有偽造護照的專業技術，他協助猶太人製造假護照，以避免被送至集中營。但此舉同時也讓他自己陷入危機。\n如果你是凱明斯基，你會幫助猶太人製作假證件嗎？", opt1: "是，努力製造護照，盡可能幫助更多人", opt2: "否，自己的安全最重要，選擇獨善其身", s1: -1, m1: 2, s2: 1, m2: 0 },
        { id: "J12", text: "J12\n馬賽琳是一名13歲小女孩，在集中營裡負責拉馬鈴薯貨車。與她合作的另一個小女孩，因過度勞動與營養不良已奄奄一息。馬賽琳會偷留下馬鈴薯，讓她補充營養，維持體力。\n如果你是馬賽琳，你也會這樣幫助小女孩嗎？", opt1: "是，想辦法偷取馬鈴薯，補充她的營養", opt2: "否，無視她的身體狀況", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "J13", text: "J13\n安妮‧法蘭克為逃避查緝，和6名猶太人躲藏在密室，密室的空間尚可容納1人。此時，附近有位猶太人遭到追捕，密室裡7人開會討論是否要讓他進入密室。\n如果你是安妮‧法蘭克，你是否會冒險收容這位逃亡的猶太人？", opt1: "是，同為猶太人就應該伸出援手", opt2: "否，人多被發現的風險就更高了", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "J14", text: "J14\n史羅因在集中營時，因擁有修理水電技術，可自由來回於兩個看守營區。一位猶太人託他將親筆信和節省下來的食物，交給在另一個營區的7歲女兒。\n如果你是史羅因，你會幫助這位猶太同胞嗎？", opt1: "是，一定將食物與信親手交給他的女兒", opt2: "否，假裝答應他，但把信燒了留下食物", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "J15", text: "J15\n納粹黨員沃納有一個猶太情人伊迪斯，沃納想要與伊迪斯完成合法婚姻程序，以生養孩子。官方提出的條件是伊迪斯必須更改信仰，並進行基督教婚禮。\n若你是伊迪斯，你會願意為生存改變猶太人信仰嗎？", opt1: "是，我願意改信，這樣才能活下去", opt2: "否，不願意，不能放棄猶太人信仰", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "J16", text: "J16\n一批辛德勒工廠的猶太工人正在集合，我獨自走到負責軍官面前說:「我應該在名單上，不知為何把我刪掉了？」軍官點頭示意我加入工人的行列，我終於脫離了地獄。\n若你看到進入辛德勒工廠的機會，是否敢冒險一試？", opt1: "是，或許這是能活著與家人團聚的機會", opt2: "否，冒險行事可能會立即喪失寶貴生命", s1: -1, m1: 0, s2: 1, m2: 0 },
        { id: "J17", text: "J17\n開往集中營的火車上，每節車廂載滿80人，每人僅能攜帶幾塊麵包。車門被封死，車廂各指派一位廂長協助管理，如果有人逃脫，廂長就會被槍決。\n若是你被指派為廂長，火車突然出軌，你會把握機會帶著同車的人逃亡嗎？", opt1: "是，把握大家活命的機會", opt2: "否，一旦被抓我就完蛋了", s1: -2, m1: 2, s2: 2, m2: -2 },
        { id: "J18", text: "J18\n女記者露德與她的朋友們，替躲藏的猶太人、政治犯張羅了住處與食物配給卡，讓他們在藏身之處不致挨餓受凍。\n若你也認識露德，是否會願意願意分享食物給這些躲藏著的猶太人呢？", opt1: "是，自己少吃一點無所謂", opt2: "否，戰爭時物資短缺，擔心自己的溫飽就夠了", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "J19", text: "J19\n集中營的工頭發現一個男孩嘴巴裡有金牙套，要求男孩交出。工頭惡狠狠地說:「如果不交出牙套，你將付出慘痛代價!」從此每天毆打男孩的父親。\n如果你是男孩，看著父親天天遭人痛打，會不會交出金牙套呢？", opt1: "是，為了父親交出金牙套", opt2: "否，金牙套可以換取食物", s1: -1, m1: 1, s2: 1, m2: -1 },
        { id: "J20", text: "J20\n有少數猶太人趁著遭遇空襲時，企圖逃離集中營，但失敗且被當場判刑，以儆效尤。營長用兩碗湯作為交換條件，徵求兩名集中營囚犯協助執行死刑。\n你長久以來都處於飢餓狀態，要把握住這個機會嗎？", opt1: "是，死刑不是我判決的，我只是協助執行而已", opt2: "否，雖然餓了很久，還是不忍心下手結束生命", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "J21", text: "J21\n集中營裡一位猶太父親忽然肚子痛，他走向警衛：「對不起,能否告訴我廁所在哪裡？」警衛從頭到腳打量他，突然重重賞這位父親一記耳光。\n如果你是這位父親的兒子，目睹一切，你會奮力保護自己的父親嗎？", opt1: "是，衝上前去揍警衛一頓", opt2: "否，假裝沒看到這一幕以保全自己", s1: -1, m1: 2, s2: 1, m2: -2 },
        { id: "J22", text: "J22\n一名猶太女子在德軍佔領期間取得偽造文件，宣稱自己是亞利安人，躲過送進集中營的命運。\n你在無意之間發現了這位女子的真實身分，你會向上級報告嗎？", opt1: "是，誠實舉報可以換得比現在更好的待遇", opt2: "否，這不干我的事，何況救人一命是好事", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "J23", text: "J23\n集中營的監工身邊會有貼身「小助手」，由年紀較小的男孩擔任，他們卻比大人更殘忍。一名13歲小助手，因為自己父親未妥善整理床舖而出手痛打。\n你目睹這個情景，會出手阻止這名小助手嗎？", opt1: "是，阻止小助手，提醒他：「這是你的父親呀!」", opt2: "否，小助手比我更有權力，裝作沒看到就好了", s1: -1, m1: 2, s2: 1, m2: -2 },
        { id: "J24", text: "J24\n集中營定期會舉行「淘汰競選」，猶太人必須全身脱光向前奔跑。此時，黨衛軍則將無法奔跑或是體力虛弱的猶太人，送入焚化爐。\n你年邁的父親或許將無法通過淘汰競選，你會想辦法幫助他嗎？", opt1: "是，陪在他身邊，協助他努力向前衝", opt2: "否，以後就不需要再把麵包分給他了", s1: -1, m1: 2, s2: 1, m2: -2 },
        { id: "J25", text: "J25\n戰爭末期物資缺乏，集中營囚犯領不到食物，只能靠吃雪過活。好心工人會扔些麵包給囚犯，幾十個飢民為了麵包一團混戰，一位老人撿到一塊麵包......\n你也在現場，你會搶下老人手上的麵包嗎？", opt1: "是，既然大家都在搶，就逼迫老人交出麵包", opt2: "否，老人運氣太好了，摸摸鼻子繼續挨餓吧", s1: 1, m1: -2, s2: -1, m2: 1 },
        { id: "J26", text: "J26\n集中營裡，病重的猶太父親已極度虛弱，營長對兒子說:「給你個建議，別再把你的麵包留給你父親，你應該吃下他的食物，才能存活下來。」\n如果你是這位父親的兒子，你會聽從營長的建議嗎？", opt1: "是，要救父親為時已晚，自己吃兩份麵包才能存活", opt2: "否，即使營長說的有道理，還是堅持要延續父親生命", s1: 1, m1: -2, s2: -1, m2: 2 },
        { id: "J27", text: "J27\n1933年《重設公職人員法》規定：「非亞利安人血統的公職人員沒有退休資格」有超過1,200名猶太教授、助教遭無故解聘，經濟頓失依靠，淪為無業游民。\n你是否願意為了家中經濟，去重新學習手藝，成為皮匠或鞋匠？", opt1: "是，去學習一技之長，養活全家人比較實際", opt2: "否，工匠地位太低了，怎麼能為五斗米折腰", s1: 1, m1: 0, s2: -1, m2: 0 },
        { id: "J28", text: "J28\n集中營裡，即即將死去的猶太父親不斷呼喚兒子的名字，希望兒子可以在臨終之際陪伴在身邊，卻換來黨衛軍憤怒地用棍子毆打。\n你知道父親在呼喚你，你會回應他的要求嗎？", opt1: "是，立刻衝到他身邊，握著他的手，令他安心", opt2: "否，實在太害怕被打，只能任由父親垂死掙扎", s1: -1, m1: 2, s2: 1, m2: -2 },
        { id: "J29", text: "J29\n畢爾斯基四兄弟，在納粹追捕中逃進了原始森林，父母和其他家庭成員都不幸遇難。他們開始著手組織反抗軍對抗納粹軍隊。\n如果你是畢爾斯基兄弟，是否會選擇組織武裝部隊進行反抗？", opt1: "是，也許有機會拯救其他猶太人", opt2: "否，好不容易逃跑，應該躲起來", s1: -2, m1: 1, s2: 2, m2: -1 },
        { id: "J30", text: "J30\n一對姊妹被命令搬入猶太區時不願服從，坐在路邊泣不成聲。路過的波蘭人聽到哭聲，心生憐憫，把她們藏入農場，兩人因此倖存下來。\n你會順從搬遷命令嗎？你不一定會有她們的幸運喔？", opt1: "是，不服從命令會招致危險，選擇乖乖聽話！", opt2: "否，拒絕不合理的命令，我要自行決定命運！", s1: 1, m1: 0, s2: -1, m2: 0 },
        { id: "J31", text: "J31\n蓋世太保下令隔離區內的猶太人必須在限期內繳交所有值錢的金飾與鐘錶，違者將公開絞刑。\n你手中藏有一枚母親留下的金戒子，是否要上繳？", opt1: "是，為了保命乖乖交出金戒", opt2: "否，冒險藏匿紀念信物", s1: 1, m1: -1, s2: -1, m2: 1 },
        { id: "J32", text: "J32\n隔離區內爆發嚴重的斑疹傷寒，藥物極度匱乏。醫生組織地下醫療團隊，需要有人冒險潛出隔離區購買藥品。\n你是否願意自願承擔這項九死一生的走私任務？", opt1: "是，為同胞冒險取得藥物", opt2: "否，風險太高選擇自保", s1: -2, m1: 2, s2: 2, m2: -2 },
        { id: "J33", text: "J33\n地下反抗組織計畫在工廠內偷偷破壞機械零件，以拖延納粹的軍火生產進度。\n身為工廠內工作的猶太技工，你是否願意加入這項破壞行動？", opt1: "是，盡力削弱納粹軍力", opt2: "否，被發現會連累整座工廠", s1: -1, m1: 2, s2: 1, m2: -1 },
        { id: "J34", text: "J34\n移送列車啟程前夕，一位陌生婦人將熟睡的嬰兒塞進你的懷中，低聲哭求你幫忙把孩子帶走撫養。\n在自身難保的逃亡路上，你是否會接下這個孩子？", opt1: "是，不忍心拋棄無辜生命", opt2: "否，帶著嬰兒絕對無法逃生", s1: -2, m1: 2, s2: 1, m2: -1 },
        { id: "J35", text: "J35\n盟軍的轟炸機群開始空襲鄰近的鐵路網與集中營周邊，警報大作，四周陷入一片混亂。\n看守的士兵慌亂中逃向防空洞，你是否要趁此機會強行衝破鐵絲網逃跑？", opt1: "是，賭上最後一絲生機逃跑", opt2: "否，留在原地等待局勢", s1: -2, m1: 1, s2: 2, m2: -1 }
    ];

    const endingsDB = {
        'G51': { title: 'G51 奧西茨基 1889-1938年', desc: '德國記者,曾批評「全國人心何等懶散,竟將愚蠢懦夫(希特勒)當成領袖、效法的典範?」1933年他被納粹囚禁於集中營,承受體力勞動及暴力毆打。1935年獲得諾貝爾和平獎。納粹迫於國際壓力釋放他,但他在集中營時感染肺結核,兩年後病逝。' },
        'G52': { title: 'G52 隆美爾 1891-1944年', desc: '二次大戰著名德國陸軍元帥,外號「沙漠之狐」。二戰末期,因不滿希特勒的統治,加入希特勒暗殺計畫。失敗後,希特勒讓他選擇有榮譽的自殺,或接受軍法審判、全家送至集中營。最終,隆美爾選擇了前者,服毒身亡。' },
        'G53': { title: 'G53 海德里希 1904-1942年', desc: '1934年擔任蓋世太保首長,在未經法律程序的情況下監禁公民。蓋世太保以「執行領袖的意志」為理由,就能隨意拘捕民眾送往集中營或加以殺害。因此他被稱為「納粹劊子手」、「布拉格屠夫」。1942年,遭到兩名捷克人刺殺,傷重不治。' },
        'G54': { title: 'G54 戈培爾 1879-1945年', desc: '1924年擔任納粹黨宣傳部長,因善於造勢、演講,被譽為「宣傳天才」。他大量焚毀禁書,積極控制德國媒體,對納粹的成功有極大貢獻,且自始至終服從希特勒,一同面對德國戰敗。1945年5月1日即希特勒自殺後隔天,他與妻子在先殺死6個孩子之後自盡。' },
        'G55': { title: 'G55 皮雷茨基 1901-1948年', desc: '波蘭騎兵隊上尉,為蒐集情報,自願進入奧斯維辛集中營。曾號召囚犯成立反抗組織,惜未能成功。1943年,他逃離後將所見所聞寫成《威托德報告》,記錄了集中營暴行。戰後波蘭共產黨建立政權,因皮雷茨基曾為反共政權蒐集情資,1948年遭到共產黨處決。' },
        'G56': { title: 'G56 穆勒 1883-1945年', desc: '德國神學家,他擔任主教時,禁止牧師在講道中發表批評政治言論,甚至允許蓋世太保監督教會。他宣揚「耶穌是亞利安人的耶穌」,並支持希特勒迫害猶太人。1945年7月,穆勒在柏林自殺身亡,此時德國已經宣布投降。' },
        'G57': { title: 'G57 希姆萊 1900-1945年', desc: '1943年出任德國內政部長,宣稱「消滅猶太民族」是亞利安人肩負的困難義務。被認為必須對歐洲600萬名猶太人、同性戀者、共產黨人的大屠殺負起主要責任。二戰末期,當希特勒得知他意圖與同盟國秘密談判停戰協定後,立即免職。德國投降後,被盟軍拘捕,服毒自殺。' },
        'G58': { title: 'G58 羅森堡 1893-1946年', desc: '為納粹黨思想領袖。其演說內容包含種族清洗、地緣政治、生存空間和納粹主義,對種族屠殺需負有重大責任。其代表著作《20世紀的神話》銷量超過100萬冊。德國投降後,羅森堡於紐倫堡審判中以戰犯身份被判處絞刑。' },
        'G59': { title: 'G59 杜克維茲 1904-1973年', desc: '德國外交官,二戰時在德國佔領下的丹麥擔任隨員。他私下透露丹麥猶太人將被遣送的確切時間。於是丹麥人自發性動員,偷偷用漁船將7900名猶太人載到中立國瑞典。戰後他持續在外交部服務,於1971年得到以色列政府褒揚為「國際義人」。' },
        'G60': { title: 'G60 辛德勒 1908-1974年', desc: '德國資本家,二戰時開工廠雇用大量猶太工人,挽救約1100人免遭屠殺。其舉動起初受利益驅使,後期他卻耗盡積蓄去維護猶太人生命。戰後,辛德勒一貧如洗,依靠猶太人救濟過活。1963年以色列授予國際義人稱號。逝世後安葬耶路撒冷聖地錫安山,是唯一葬於此地的納粹黨成員。' },
        'G61': { title: 'G61 克勒韋爾因加 1894-1980', desc: '荷蘭萊頓大學法學院教授。1940年因抗議反猶法令,聲援被納粹解雇的猶太同事,隔天被送往集中營,幸而存活下來。1945年萊頓大學在戰後重新營運,克勒韋爾因加成功復職。1953年,獲得美國政府授予自由勳章,表揚他在戰爭期間對自由的捍衛。' },
        'G62': { title: 'G62 尼莫拉 1892-1984年', desc: '德國神學家。納粹執政初期,承諾保障教會財產權、自主權與信仰自由。1937年納粹逮捕不滿的神職人員,於是尼莫拉公開反對納粹,遭到逮捕。輾轉於薩克森、達豪集中營,差點被處死。戰後他致力於推動和平對話,獲得列寧和平獎。1984年去世,享壽92歲。' },
        'G63': { title: 'G63 拜茲 1913-2013年', desc: '前克魯伯鋼鐵公司總裁。他曾像辛德勒一樣向政府申請猶太勞工。此外,他還將猶太兒童藏匿在家中房間來躲避緝捕,也曾因遭蓋世太保懷疑,差一點就被逮捕。1944年,國軍徵召他入伍,間接停止了救援行動。1973年,得到以色列政府「國際義人」的褒揚。' },
        'G64': { title: 'G64 門格勒 1911-1979年', desc: '1943年,在奧斯威辛集中營擔任黨衛軍醫師。他在集中營時罔顧人命,進行慘無人道的活體實驗。戰後,他繼續在西德行醫,被追捕後逃亡南美。1959年,受到一千萬馬克的重金懸賞通緝。最終,於1979年意外溺死於巴西。' },
        'G65': { title: 'G65 史圖侯德 1898-1986年', desc: '德國航空部門醫學家,因研究負壓真空下人體出現的反應,被譽為「太空醫學之父」。但他利用猶太囚犯進行活體實驗,對囚犯而言是極為痛苦的酷刑。二戰後,他在美國太空總署擔任高階職位。過世後,曾進行人體實驗之事才被揭露,名譽掃地。' },
        'G66': { title: 'G66 葛朗寧 1921-2018年', desc: '葛朗寧被稱為「奧斯維辛集中營的帳房」,負責清點從囚犯搜刮的財物,並目睹大屠殺過程。2014年他被指控「協助謀殺」3萬名猶太人的大規模屠殺,遭到判處有期徒刑4年。他申請緩刑,但被法院駁回,入獄前在醫院過世。' },
        'J51': { title: 'J51 柯扎克 1879-1942年', desc: '柯扎克是研究兒童心理發展的先鋒,被譽為「兒童人權之父」。1989年聯合國通過的《兒童權利公約》即源於其理念。二戰爆發後,他拒絕友人替他偽造證件來逃離猶太人聚集區。1942年,德國納粹包圍了猶太人聚集區。柯扎克和孩子們被押往死亡集中營,最終慘遭殺害。<br><br><a href="https://pse.is/9rngz7" target="_blank">🔗 點擊觀看真實歷史故事</a>' },
        'J52': { title: 'J52 弗朗切斯卡曼恩 ?-1943年', desc: '波蘭猶太裔芭蕾舞演員,早期被監禁於華沙猶太營。在移送過程中,據說她搶奪了軍官席林格的手槍並打傷他的腹部,同時又朝另一位軍官開槍。然而,隨後增援過來的部隊以機關槍對著整群猶太婦女掃射,造成所有猶太婦女當場身亡。弗朗切斯卡.曼恩則以手槍結束了自己的生命。<br><br><a href="https://pse.is/9rnh12" target="_blank">🔗 點擊觀看真實歷史故事</a>' },
        'J53': { title: 'J53 安妮.法蘭克 1929-1945年', desc: '生於德國富裕猶太家庭。1933年納粹崛起,於是舉家遷居荷蘭。二戰時德國佔領荷蘭,與家人一起躲藏在房間深處,直到1944年才被發現,送往「奧斯威辛集中營」。在集中營裡-她與姊姊相繼因病過世。安妮的父親是全家唯一的倖存者,他繼承女兒的手稿《安妮日記》後,將其整理出版。<br><br><a href="https://pse.is/9rnhrg" target="_blank">🔗 點擊觀看真實歷史故事</a>' },
        'J54': { title: 'J54 維多·哈森 1916-1946年', desc: '1941年德軍佔領希臘,哈森當上猶太警察局長,自願成為抓捕逃亡者的「賞金獵人」,並向遭到囚禁的猶太人勒索珠寶、金錢。1943年,納粹將希臘當地48533名猶太人送往集中營,就連哈森父親也遭毒氣殺害。1944年10月希臘解放後,哈森被捕受審,判處死刑。<br><br><a href="https://pse.is/9rnj4c" target="_blank">🔗 點擊觀看真實歷史故事</a>' },
        'J55': { title: 'J55 埃米爾·埃爾溫·馬爾 1900-1967年', desc: '納粹達豪集中營火葬場的猶太人囚工。這職位名為「卡波」(Kapo),意思是管理某個特定營房的小隊長。「卡波」對待囚徒極為殘暴,這是因卡波如表現得不夠暴力,隨時會被撤換。戰後,他被美國軍事法庭起訴,一開始被判絞刑。後來,死刑被減為十年監禁,被囚禁於戰犯監獄。<br><br><a href="https://pse.is/9rnjtm" target="_blank">🔗 點擊觀看真實歷史故事</a>' },
        'J56': { title: 'J56 佩切爾斯基 1909-1990年', desc: '蘇聯猶太人。曾在集中營策畫反抗行動,並在成功暗殺11名黨衛軍後,使420人因此越獄。事後,他和同伴輾轉進入蘇聯軍隊,並活到戰後。但他的事蹟並無人知曉。1990年佩切爾斯基默默去世。直到二十年後,其英勇事蹟才被披露,成為蘇聯和以色列的英雄。<br><br><a href="https://pse.is/9rnkw8" target="_blank">🔗 點擊觀看真實歷史故事</a>' },
        'J57': { title: 'J57 海倫娜 1920-1998年', desc: '比利時猶太人。對納粹恨之入骨而加入游擊隊,並利用假證件混入德軍指揮部擔任秘書。游擊隊成功暗殺數位德國軍官,打擊了德軍士氣。但人們並不曉得海倫娜的真實身份。戰爭結束後,唾罵、拳腳像海浪般湧向她,身分釐清後才得到平反。她曾主演自傳電影,傳遞猶太人的苦痛故事。<br><br><a href="https://pse.is/9rnlle" target="_blank">🔗 點擊觀看真實歷史故事</a>' },
        'J58': { title: 'J58 羅泰姆 1924-2018年', desc: '1939年德軍入侵波蘭,強迫波蘭猶太人住在隔離區。然而,擁擠的人數、糟糕的衛生、食物匱乏等,促使地下反抗運動興起。羅泰姆即為其中一員。1943年他參加華沙猶太人起義,有56,065名猶太人犧牲。羅泰姆幫助了數千名猶太人順利逃亡。戰後他曾多次獲波蘭政府頒發國家最高榮譽,年邁時移居以色列,2018年以94歲高齡病逝。<br><br><a href="https://pse.is/9rp6ah" target="_blank">🔗 點擊觀看真實歷史故事</a>' },
        'J59': { title: 'J59 葛柏 1922-2020年', desc: '納粹挑選強健猶太囚犯為「特遣隊」,協助滅絕工作。葛柏負責修剪女屍的頭髮,心裡總是懼怕在屍堆中看見家人。納粹會複查屍體,若發現值錢物品未被取出,特遣隊員也會被丟入焚化爐。戰後,特遣隊倖存者只有百人。後來他擔任納粹戰犯法庭的證人,直到2020年才以97歲高齡辭世。<br><br><a href="https://pse.is/9rp6mp" target="_blank">🔗 點擊觀看真實歷史故事</a>' },
        'J60': { title: 'J60 米爾希 1892-1972年', desc: '1920年創立航空公司,是漢莎航空第一任總經理。納粹要求其負責二戰空軍戰鬥機的生產。米爾希因父親是猶太人,備受納粹內部質疑。然而,希特勒依然任命他為空軍大元帥,是德軍少數猶太裔軍人裡最高軍階者。二戰後米爾希被判終身監禁,1954年獲得釋放,1972年逝世。' },
        'J61': { title: 'J61 魏什爾 1891-1982年', desc: '捷克猶太人記者,1933年當納粹抵制猶太人,他出面呼籲猶太人應該保存民族意識:「驕傲地戴上黃色的六芒星吧!」1938年因戰爭波及,逃亡巴勒斯坦的時候,他後悔地說道:「若能預知大屠殺的發生,我當時絕對不會提出那個口號!」<br><br><a href="https://pse.is/9rp6xd" target="_blank">🔗 點擊觀看真實歷史故事</a>' },
        'J62': { title: 'J62 韋內齊亞 1923-2012年', desc: '納粹在集中營裡挑選出身體強健的囚犯組成「特遣隊」,負責搜查屍體,取出值錢物品、金牙,再將屍體塞進焚燒爐。韋內齊亞是特遣隊的一員,且幸運存活下來。戰後他被視為納粹幫兇,受到毆打、報復。戰後,他成為極少數存活的特遣隊隊員。數十年後,他撰寫回憶錄《奧斯威辛特遣隊》,向世人揭露納粹最黑暗、最真實的罪行。<br><br><a href="https://pse.is/9rp6xd" target="_blank">🔗 點擊觀看真實歷史故事</a>' }
    };

    // ==========================================
    // 2. 全域狀態與工具模組
    // ==========================================
    
    const GameState = {
        players: [],
        currentPlayerIndex: 0,
        currentRound: 1,
        cardPools: { 'A': [], 'J': [] },
        
        initCardPools: function() {
            this.cardPools['A'] = GameUtils.shuffleArray(gCards);
            this.cardPools['J'] = GameUtils.shuffleArray(jCards);
        },
        
        drawCard: function(role) {
            if (this.cardPools[role].length === 0) {
                const originalPool = role === 'A' ? gCards : jCards;
                this.cardPools[role] = GameUtils.shuffleArray(originalPool);
            }
            return this.cardPools[role].pop();
        },
        
        getCurrentPlayer: function() {
            return this.players[this.currentPlayerIndex];
        }
    };

    const GameUtils = {
        shuffleArray: function(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        },
        switchStep: function(stepNum) {
            document.querySelectorAll('.step-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`step-${stepNum}`).classList.add('active');
        }
    };

    const AudioController = {
        init: function() {
            document.body.addEventListener('click', () => this.unlockAudio(), { once: true });
        },
        unlockAudio: function() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('music-toggle-btn');
            if (music.paused && !document.getElementById('step-4').classList.contains('active')) {
                 music.play().then(() => {
                    btn.innerText = "關閉音樂";
                }).catch(e => console.log("等待玩家進一步互動以播放音樂：", e));
            }
        },
        toggleMusic: function() {
            const bgMusic = document.getElementById('bg-music');
            const endingMusic = document.getElementById('ending-music');
            const btn = document.getElementById('music-toggle-btn');
            const isEndingStep = document.getElementById('step-4').classList.contains('active');
            
            const activeMusic = isEndingStep ? endingMusic : bgMusic;
            
            if (activeMusic.paused) {
                activeMusic.play();
                btn.innerText = "關閉音樂";
            } else {
                activeMusic.pause();
                btn.innerText = "開啟音樂";
            }
        },
        playGameOverSound: function() {
            const sound = document.getElementById('game-over-sound');
            if (sound) {
                sound.currentTime = 0;
                sound.play().catch(e => console.log("音效播放被阻擋：", e));
            }
        },
        switchToEndingMusic: function() {
            const bgMusic = document.getElementById('bg-music');
            const endingMusic = document.getElementById('ending-music');
            const btn = document.getElementById('music-toggle-btn');
            
            bgMusic.pause();
            bgMusic.currentTime = 0;
            
            endingMusic.currentTime = 0;
            endingMusic.play().then(() => {
                btn.innerText = "關閉音樂";
            }).catch(e => {
                console.log("結局音樂播放被阻擋：", e);
                btn.innerText = "開啟音樂";
            });
        }
    };

    // ==========================================
    // 3. 頁面模組化封裝 (Page Handlers)
    // ==========================================

    const Page1_Setup = {
        init: function() {
            this.renderPlayerInputs();
        },
        renderPlayerInputs: function() {
            const countSelect = document.getElementById('player-count');
            if (!countSelect) return;
            const count = countSelect.value;
            const container = document.getElementById('player-inputs-container');
            if (!container) return;
            
            container.innerHTML = '';
            for (let i = 0; i < count; i++) {
                container.innerHTML += `
                    <div class="player-input-group">
                        <label>玩家 ${i+1}</label>
                        <input type="text" id="p-name-${i}" placeholder="輸入名字(3字內)" maxlength="3" value="玩家${i+1}">
                    </div>
                `;
            }
        },
        submit: function() {
            const count = parseInt(document.getElementById('player-count').value);
            GameState.players = [];
            GameState.initCardPools();

            let roles = [];
            const half = Math.round(count / 2);
            for (let i = 0; i < count; i++) {
                roles.push(i < half ? 'A' : 'J');
            }
            roles = GameUtils.shuffleArray(roles);

            for (let i = 0; i < count; i++) {
                const nameInputElem = document.getElementById(`p-name-${i}`);
                const nameInput = nameInputElem ? nameInputElem.value.trim() || `玩家${i+1}` : `玩家${i+1}`;
                
                GameState.players.push({
                    name: nameInput,
                    role: roles[i],
                    survival: 10,
                    moral: 10,
                    isDead: false
                });
            }
            
            Page2_RoleResult.init();
        }
    };

    const Page2_RoleResult = {
        init: function() {
            const resContainer = document.getElementById('identity-results');
            resContainer.innerHTML = '';
            
            GameState.players.forEach(p => {
                const roleName = p.role === 'A' ? '雅利安人 (A)' : '猶太人 (J)';
                const roleColor = p.role === 'A' ? 'var(--accent-blue)' : 'var(--accent-red)';
                resContainer.innerHTML += `
                    <div style="background: var(--card-bg); border: 2px solid var(--border-color); padding: 25px; width: 200px; text-align: center; box-shadow: 2px 2px 6px rgba(0,0,0,0.1);">
                        <strong style="font-size: 1.8rem;">${p.name}</strong><br><br>
                        <span style="color: ${roleColor}; font-weight: 900; font-size: 1.6rem;">${roleName}</span>
                    </div>
                `;
            });

            GameUtils.switchStep(2);
        },
        startGame: function() {
            Page3_Gameplay.init();
        }
    };

    const Page3_Gameplay = {
        init: function() {
            GameState.currentPlayerIndex = 0;
            GameState.currentRound = 1;
            GameUtils.switchStep(3);
            this.loadQuestion();
        },
        loadQuestion: function() {
            if (GameState.players.some(p => p.isDead)) {
                Page4_Ending.init();
                return;
            }

            const player = GameState.getCurrentPlayer();
            
            // 清除上一輪的動畫 class 確保不會殘留
            document.getElementById('current-survival-score').classList.remove('bounce-anim');
            document.getElementById('current-moral-score').classList.remove('bounce-anim');
            
            document.getElementById('current-player-turn').innerText = `玩家：${player.name}`;
            document.getElementById('current-player-role').innerText = `身分：${player.role === 'A' ? '雅利安人' : '猶太人'}`;
            document.getElementById('current-survival-score').innerText = player.survival;
            document.getElementById('current-moral-score').innerText = player.moral;
            document.getElementById('current-round-info').innerText = `回合：${GameState.currentRound}`;

            const card = GameState.drawCard(player.role);
            document.getElementById('card-text-display').innerText = card.text;

            const optionsDiv = document.getElementById('card-options-display');
            optionsDiv.innerHTML = `
                <button class="option-btn" onclick="Page3_Gameplay.handleChoice(${card.s1}, ${card.m1})">1. ${card.opt1}</button>
                <button class="option-btn" onclick="Page3_Gameplay.handleChoice(${card.s2}, ${card.m2})">2. ${card.opt2}</button>
            `;
        },
        handleChoice: function(sChange, mChange) {
            const player = GameState.getCurrentPlayer();
            player.survival += sChange;
            player.moral += mChange;

            // 確保生存指數不低於 0
            if (player.survival < 0) player.survival = 0;

            const survivalEl = document.getElementById('current-survival-score');
            const moralEl = document.getElementById('current-moral-score');

            survivalEl.innerText = player.survival;
            moralEl.innerText = player.moral;
            
            // 移除舊的動畫觸發重繪 (Reflow) 以便再次播放
            survivalEl.classList.remove('bounce-anim');
            moralEl.classList.remove('bounce-anim');
            void survivalEl.offsetWidth; 
            void moralEl.offsetWidth;

            // 判斷是否需要加入「彈跳與變色」動畫
            if (sChange > 0) survivalEl.classList.add('bounce-anim');
            if (mChange > 0) moralEl.classList.add('bounce-anim');
            
            // 鎖定按鈕防止連續點擊
            const buttons = document.querySelectorAll('.option-btn');
            buttons.forEach(btn => btn.disabled = true);

            // 延遲執行，讓玩家看見數值變動的動畫再跳轉回合
            setTimeout(() => {
                if (player.survival <= 0) {
                    player.isDead = true;
                    AudioController.playGameOverSound();
                    Page4_Ending.init(player.name);
                    return;
                }

                GameState.currentPlayerIndex = (GameState.currentPlayerIndex + 1) % GameState.players.length;
                if (GameState.currentPlayerIndex === 0) {
                    GameState.currentRound++;
                }

                this.loadQuestion();
            }, 800); // 動畫延遲約 0.8 秒跳轉
        }
    };

    const Page4_Ending = {
        init: function(deadPlayerName = null) {
            AudioController.switchToEndingMusic();
            GameUtils.switchStep(4);
            
            const container = document.getElementById('final-results-container');
            container.innerHTML = '';

            if (deadPlayerName) {
                container.innerHTML += `
                    <div class="death-banner">
                        【${deadPlayerName}】的生存指數已歸零！<br>歷史的洪流無情吞噬，遊戲強制結束。
                    </div>
                `;
            }

            this.renderFinalResults(container);
        },
        renderFinalResults: function(container) {
            const usedEndings = new Set();

            GameState.players.forEach(p => {
                let possibleEndingIds = [];

                if (p.role === 'A') {
                    if (p.survival === 0) {
                        possibleEndingIds = p.moral > 4 ? ['G51', 'G52'] : ['G53', 'G54'];
                    } else if (p.survival <= 8) {
                        possibleEndingIds = p.moral > 4 ? ['G55'] : ['G56', 'G57', 'G58'];
                    } else { 
                        possibleEndingIds = p.moral > 4 ? ['G59', 'G60', 'G61', 'G62', 'G63'] : ['G64', 'G65', 'G66'];
                    }
                } else { 
                    if (p.survival === 0) {
                        possibleEndingIds = p.moral > 4 ? ['J51'] : ['J52'];
                    } else if (p.survival <= 5) {
                        possibleEndingIds = p.moral > 4 ? ['J53'] : ['J54', 'J55'];
                    } else { 
                        possibleEndingIds = p.moral > 4 ? ['J56', 'J57', 'J58', 'J59'] : ['J60', 'J61', 'J62'];
                    }
                }

                let availableEndings = possibleEndingIds.filter(id => !usedEndings.has(id));

                if (availableEndings.length === 0) {
                    availableEndings = possibleEndingIds;
                }

                const randId = availableEndings[Math.floor(Math.random() * availableEndings.length)];
                usedEndings.add(randId); 

                const chosenEnding = endingsDB[randId];
                const statusText = p.survival === 0 ? '<span style="color: var(--accent-red); font-weight: 900;">[已陣亡]</span>' : '<span style="color: var(--accent-green); font-weight: 900;">[存活]</span>';

                container.innerHTML += `
                    <div class="ending-card">
                        <h3>【${p.name}】最終結算 ${statusText}</h3>
                        <table class="score-board">
                            <tr>
                                <th>身分</th>
                                <th>最終生存指數</th>
                                <th>最終道德指數</th>
                            </tr>
                            <tr>
                                <td>${p.role === 'A' ? '雅利安人' : '猶太人'}</td>
                                <td>${p.survival}</td>
                                <td>${p.moral}</td>
                            </tr>
                        </table>
                        <h4>${chosenEnding.title}</h4>
                        <p>${chosenEnding.desc}</p>
                    </div>
                `;
            });
        }
    };

    // ==========================================
    // 4. 初始化啟動
    // ==========================================
    AudioController.init();
    Page1_Setup.init();

</script>
